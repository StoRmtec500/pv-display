# ===========================================================================
#  PV-Display für ESP32-2432S028 ("Cheap Yellow Display")
#  ESP32 (ohne PSRAM), 2,8" 320×240 quer, resistiver Touch (XPT2046), 4 MB Flash
#  Bauen:  esphome compile board-2432s028.yaml
# ===========================================================================

substitutions:
  name: pv-display-cyd
  friendly_name: PV Display1
  project_name: mksoft.pv-display-cyd
  update_manifest: https://update.mksoft.at/pv-display-cyd/manifest.json

  # Display-Variante – steht auf der Rückseite bzw. erkennbar an den USB-Buchsen:
  #   ESP32-2432S028        nur Micro-USB             (ILI9341)
  #   ESP32-2432S028-7789   Micro-USB + USB-C         (ST7789)
  #   ESP32-2432S028-9342   Micro-USB + USB-C, andere Charge (ILI9342)
  cyd_model: ESP32-2432S028-7789
  # 90 = USB-Buchse rechts, 270 = USB-Buchse links
  cyd_rotation: "90"

  # Update-Popup: so viele Zeilen der Release-Beschreibung / Zeichen pro Zeile
  upd_lines: "4"
  upd_line_chars: "40"
  # Energiefluss-Seite: Mittelpunkt und Kanten der Knoten (Pixel)
  flow_cx: "160"
  flow_cy: "138"
  flow_top: "84"
  flow_bottom: "192"
  flow_left: "82"
  flow_right: "238"
  flow_dot_half: "5"
  # Hinweis im Chip unter dem Ring, wenn kein Wechselrichter antwortet
  offline_text: Keine Verbindung
  # Akku-Kachel: nur "lädt"/"entlädt" (Leistung steht im Energiefluss)
  akku_tile_power: "false"

packages:
  common: !include common.yaml

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"    # Reserve für parallelen Netzwerk-Scan
      # Kein PSRAM: HTTPS (Update-Manifest) braucht sonst ~40 KB freien Speicher
      # am Stück. Dynamische TLS-Puffer belegen RAM nur während der Verbindung.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: y

# ---------------------------------------------------------------------------
#  Hardware: Display, Touch, Hintergrundbeleuchtung, RGB-LED
# ---------------------------------------------------------------------------

spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: mipi_spi
    model: ${cyd_model}
    id: main_display
    spi_id: display_spi
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    threshold: 400
    # Typische Werte – exakte Werte je Gerät mit dem Dev-Build ermitteln
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_out
  # RGB-LED auf der Rückseite (low-aktiv) – wird beim Start ausgeschaltet
  - platform: gpio
    pin: GPIO4
    id: led_red
    inverted: true
  - platform: gpio
    pin: GPIO16
    id: led_green
    inverted: true
  - platform: gpio
    pin: GPIO17
    id: led_blue
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Display Beleuchtung
    output: backlight_out
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms


# ---------------------------------------------------------------------------
#  Schriften – klein gehalten wegen 4 MB Flash
# ---------------------------------------------------------------------------

font:
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: font_s
    size: 12
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: font_m
    size: 17
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: font_l
    size: 22
    bpp: 4
    glyphs: "0123456789.,-%: "
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: font_xl
    size: 40
    bpp: 4
    glyphs: "0123456789.,-"
  # Symbole: Material Design Icons
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon
    size: 26
    bpp: 4
    glyphs:
      - "\U000F0D9C"   # solar-panel-large
      - "\U000F0D3E"   # transmission-tower
      - "\U000F12A3"   # battery-high
      - "\U000F02DC"   # home
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon_m
    size: 18
    bpp: 4
    glyphs:
      - "\U000F1904"   # home-lightning-bolt-outline (Energiefluss)
      - "\U000F08BB"   # cog-outline (Einstellungen)
      - "\U000F0141"   # chevron-left (zurück)
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon_s
    size: 14
    bpp: 4
    glyphs:
      - "\U000F05A8"   # white-balance-sunny
      - "\U000F02DC"   # home
      - "\U000F0D3E"   # transmission-tower
      - "\U000F12A3"   # battery-high
      - "\U000F00F6"   # calendar-today
      - "\U000F032A"   # leaf
      - "\U000F05D6"   # alert-circle-outline

# ---------------------------------------------------------------------------
#  Oberfläche (320 × 240 quer)
#  Gleiche Widget-IDs und Farben wie board-4848s040.yaml – common.yaml befüllt sie.
# ---------------------------------------------------------------------------

lvgl:
  displays: [main_display]
  touchscreens: [touch]
  rotation: ${cyd_rotation}         # Drehung macht LVGL, nicht der Display-Treiber
  buffer_size: 25%                  # kein PSRAM: Teil-Puffer statt Vollbild
  default_font: font_s

  style_definitions:
    - id: st_card
      bg_color: 0x111827
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1C2638
      pad_all: 8
    - id: st_btn
      bg_color: 0x141C2E
      bg_opa: COVER
      radius: 9
      border_width: 1
      border_color: 0x1C2638
      shadow_width: 0
    - id: st_bare             # unsichtbarer Container (Layout-Hilfe)
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
    - id: st_chip
      bg_color: 0x111827
      bg_opa: COVER
      radius: 12
      border_width: 1
      border_color: 0x1C2638
      pad_left: 9
      pad_right: 9
      pad_top: 0
      pad_bottom: 0
    - id: st_node
      bg_color: 0x111827
      bg_opa: COVER
      radius: 22
      border_width: 3
      pad_all: 0

  # Update-Popup: liegt über allen Seiten, wird von script update_popup gesteuert
  top_layer:
    widgets:
      - obj:
          id: upd_popup
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 75%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - obj:
                align: CENTER
                width: 296
                height: 214
                styles: st_card
                radius: 16
                pad_all: 12
                scrollable: false
                widgets:
                  - label:
                      id: upd_title
                      align: TOP_MID
                      text: ""
                      text_font: font_m
                      text_color: 0xF8FAFC
                  - label:
                      id: upd_text
                      align: TOP_MID
                      y: 28
                      width: 272
                      long_mode: WRAP
                      text_align: CENTER
                      text: ""
                      text_color: 0xCBD5E1
                  - bar:
                      id: upd_bar
                      hidden: true
                      align: TOP_MID
                      y: 110
                      width: 250
                      height: 8
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x1A2335
                      indicator:
                        bg_color: 0x2563EB
                  - label:
                      id: upd_pct
                      hidden: true
                      align: BOTTOM_MID
                      text: ""
                      text_color: 0x8391A7
                  - obj:
                      id: upd_buttons
                      align: BOTTOM_MID
                      width: 100%
                      height: 32
                      styles: st_bare
                      scrollable: false
                      widgets:
                        - button:
                            align: LEFT_MID
                            width: 130
                            height: 32
                            styles: st_btn
                            on_click:
                              - lambda: id(upd_dismissed) = id(fw_update).update_info.latest_version;
                              - script.execute: update_popup
                            widgets:
                              - label: { align: CENTER, text: "Später", text_color: 0xF8FAFC }
                        - button:
                            align: RIGHT_MID
                            width: 130
                            height: 32
                            styles: st_btn
                            bg_color: 0x2563EB
                            border_width: 0
                            on_click:
                              - update.perform: fw_update
                            widgets:
                              - label: { align: CENTER, text: "Jetzt installieren", text_color: 0xFFFFFF }

  pages:
    # ======================= Hauptseite =======================
    - id: page_main
      bg_color: 0x070B14
      widgets:
        # ---- Kopfzeile: Uhrzeit, Tagesertrag, Status, Navigation ----
        - label:
            id: lbl_time
            x: 10
            y: 7
            text: "--:--"
            text_font: font_l
            text_color: 0xF8FAFC
        - label:                       # Datum: auf dem kleinen Display kein Platz
            id: lbl_date
            hidden: true
            text: ""
        - obj:
            styles: st_chip
            x: 76
            y: 8
            width: SIZE_CONTENT
            height: 24
            clickable: false
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 4
            widgets:
              - label: { text: "\U000F00F6", text_font: font_icon_s, text_color: 0x8391A7 }
              - label: { id: lbl_eday, text: "Heute --", text_color: 0xCBD5E1 }
        - obj:
            styles: st_bare
            align: TOP_RIGHT
            x: -84
            y: 14
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            clickable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 5
            widgets:
              - obj:
                  id: dot_status
                  width: 8
                  height: 8
                  radius: 4
                  border_width: 0
                  bg_color: 0xEF4444
              - label:                 # nur der Punkt – Text hat keinen Platz
                  id: lbl_status
                  hidden: true
                  text: ""
                  text_color: 0x8391A7
        - button:
            align: TOP_RIGHT
            x: -44
            y: 4
            width: 34
            height: 32
            styles: st_btn
            on_click:
              - lvgl.page.show: page_flow
            widgets:
              - label: { align: CENTER, text: "\U000F1904", text_font: font_icon_m, text_color: 0xFACC15 }
        - button:
            align: TOP_RIGHT
            x: -6
            y: 4
            width: 34
            height: 32
            styles: st_btn
            on_click:
              - lvgl.page.show: page_settings
            widgets:
              - label: { align: CENTER, text: "\U000F08BB", text_font: font_icon_m, text_color: 0xCBD5E1 }

        # ---- Links: Ring = PV-Leistung im Verhältnis zur Anlagenleistung ----
        - obj:
            styles: st_bare
            x: 4
            y: 42
            width: 160
            height: 160
            clickable: false
            scrollable: false
            widgets:
              - arc:
                  id: arc_pv
                  align: CENTER
                  width: 156
                  height: 156
                  min_value: 0
                  max_value: 100
                  value: 0
                  adjustable: false
                  clickable: false
                  arc_color: 0x1A2335
                  arc_width: 12
                  arc_rounded: true
                  indicator:
                    arc_color: 0xFACC15
                    arc_width: 12
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    pad_all: 0
              - obj:
                  styles: st_bare
                  align: CENTER
                  y: -42
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 3
                  widgets:
                    - label: { text: "\U000F05A8", text_font: font_icon_s, text_color: 0xFACC15 }
                    - label: { text: "Erzeugung", text_color: 0xFACC15 }
              - label:
                  id: lbl_pv
                  align: CENTER
                  y: -11
                  text: "--"
                  text_font: font_xl
                  text_color: 0xFDE047
              - label:
                  id: lbl_pv_unit
                  align: CENTER
                  y: 14
                  text: "kW"
                  text_font: font_m
                  text_color: 0x8391A7
              - label:                 # "von 14 kWp · 49 %" – im kleinen Ring kein Platz
                  id: lbl_pv_sub
                  hidden: true
                  align: CENTER
                  y: 32
                  text: ""
                  text_color: 0x8391A7

        # Autarkie bzw. Verbindungshinweis unter dem Ring
        - obj:
            styles: st_bare
            x: 4
            y: 206
            width: 160
            height: 26
            clickable: false
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - obj:
                  id: chip_autarkie
                  hidden: true
                  styles: st_chip
                  width: SIZE_CONTENT
                  height: 24
                  border_color: 0x14532D
                  clickable: false
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 4
                  widgets:
                    - label: { id: ico_autarkie, text: "\U000F032A", text_font: font_icon_s, text_color: 0x4ADE80 }
                    - label: { id: lbl_autarkie, text: "", text_color: 0x4ADE80 }

        # ---- Rechts: Haus / Netz / Akku ----
        - obj:
            styles: st_card
            x: 168
            y: 42
            width: 146
            height: 62
            scrollable: false
            widgets:
              - obj:
                  width: 20
                  height: 20
                  radius: 10
                  border_width: 0
                  pad_all: 0
                  bg_color: 0x172554
                  clickable: false
                  widgets:
                    - label: { align: CENTER, text: "\U000F02DC", text_font: font_icon_s, text_color: 0x60A5FA }
              - label: { x: 25, y: 3, text: "Haus", text_color: 0x8391A7 }
              - label: { align: TOP_RIGHT, y: 3, text: "Verbrauch", text_color: 0x60A5FA }
              - obj:
                  styles: st_bare
                  align: BOTTOM_LEFT
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: END, flex_align_track: CENTER, pad_column: 3 }
                  widgets:
                    - label: { id: lbl_load, text: "--", text_font: font_l, text_color: 0xF8FAFC }
                    - label: { id: lbl_load_unit, text: "kW", text_color: 0x8391A7, pad_bottom: 3 }
        - obj:
            styles: st_card
            x: 168
            y: 107
            width: 146
            height: 62
            scrollable: false
            widgets:
              - obj:
                  width: 20
                  height: 20
                  radius: 10
                  border_width: 0
                  pad_all: 0
                  bg_color: 0x1E293B
                  clickable: false
                  widgets:
                    - label: { align: CENTER, text: "\U000F0D3E", text_font: font_icon_s, text_color: 0xCBD5E1 }
              - label: { x: 25, y: 3, text: "Netz", text_color: 0x8391A7 }
              - label: { id: lbl_grid_sub, align: TOP_RIGHT, y: 3, text: "", text_color: 0x8391A7 }
              - obj:
                  styles: st_bare
                  align: BOTTOM_LEFT
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: END, flex_align_track: CENTER, pad_column: 3 }
                  widgets:
                    - label: { id: lbl_grid, text: "--", text_font: font_l, text_color: 0xF8FAFC }
                    - label: { id: lbl_grid_unit, text: "kW", text_color: 0x8391A7, pad_bottom: 3 }
        - obj:
            styles: st_card
            x: 168
            y: 172
            width: 146
            height: 62
            scrollable: false
            widgets:
              - obj:
                  width: 20
                  height: 20
                  radius: 10
                  border_width: 0
                  pad_all: 0
                  bg_color: 0x14532D
                  clickable: false
                  widgets:
                    - label: { align: CENTER, text: "\U000F12A3", text_font: font_icon_s, text_color: 0x4ADE80 }
              - label: { x: 25, y: 3, text: "Akku", text_color: 0x8391A7 }
              - label: { id: lbl_akku_sub, align: TOP_RIGHT, y: 3, text: "kein Akku", text_color: 0x8391A7 }
              - obj:
                  styles: st_bare
                  align: BOTTOM_LEFT
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: END, flex_align_track: CENTER, pad_column: 3 }
                  widgets:
                    - label: { id: lbl_soc, text: "--", text_font: font_l, text_color: 0xF8FAFC }
                    - label: { text: "%", text_color: 0x8391A7, pad_bottom: 3 }
              - bar:
                  id: bar_soc
                  align: BOTTOM_RIGHT
                  y: -7
                  width: 56
                  height: 6
                  min_value: 0
                  max_value: 100
                  value: 0
                  radius: 3
                  bg_color: 0x1A2335
                  indicator:
                    bg_color: 0x4ADE80
                    radius: 3

        # Hinweis bei fehlendem WLAN (überdeckt die rechte Spalte)
        - obj:
            id: hint_box
            styles: st_card
            bg_color: 0x172554
            border_color: 0x1E3A8A
            x: 168
            y: 42
            width: 146
            height: 192
            scrollable: false
            widgets:
              - label:
                  width: 100%
                  long_mode: WRAP
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xF8FAFC
                  text: "WLAN einrichten: Mit dem Handy das WLAN „${setup_ssid}“ verbinden (Passwort: ${setup_password}) und den Anweisungen folgen."

    # ======================= Ersteinrichtung =======================
    # Wird beim Start gezeigt, solange kein Wechselrichter gespeichert ist.
    # Inhalt setzt das Script setup_render in common.yaml.
    - id: page_setup
      bg_color: 0x070B14
      widgets:
        - label:
            align: TOP_MID
            y: 8
            text: "Willkommen"
            text_font: font_m
            text_color: 0xF8FAFC
        - label:
            id: setup_step
            align: TOP_MID
            y: 32
            text: ""
            text_color: 0x8391A7
        - label:
            id: setup_text
            align: TOP_MID
            y: 54
            width: 300
            long_mode: WRAP
            text_align: CENTER
            text: ""
            text_color: 0xF8FAFC
        - label:
            id: setup_ip_caption
            align: TOP_MID
            y: 112
            text: ""
            text_color: 0x8391A7
        - label:
            id: setup_ip
            align: TOP_MID
            y: 128
            text: ""
            text_font: font_m
            text_color: 0x60A5FA
        - bar:
            id: setup_bar
            align: TOP_MID
            y: 158
            width: 280
            height: 6
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x1A2335
            indicator:
              bg_color: 0x2563EB
        - label:
            id: setup_status
            align: TOP_MID
            y: 170
            width: 300
            long_mode: DOT
            text_align: CENTER
            text: ""
            text_color: 0x8391A7
        - button:
            id: btn_setup_retry
            hidden: true
            align: BOTTOM_MID
            x: -76
            y: -8
            width: 140
            height: 32
            styles: st_btn
            bg_color: 0x2563EB
            border_width: 0
            on_click:
              - lambda: |-
                  id(scan_repair) = false;
                  fronius_scan::start();
              - script.execute: setup_render
            widgets:
              - label: { align: CENTER, text: "Erneut suchen", text_color: 0xFFFFFF }
        - button:
            align: BOTTOM_MID
            x: 76
            y: -8
            width: 140
            height: 32
            styles: st_btn
            on_click:
              - lambda: id(setup_mode) = false;
              - lvgl.page.show: page_main
              - script.execute: update_popup
            widgets:
              - label: { align: CENTER, text: "Überspringen", text_color: 0xF8FAFC }

    # ======================= Energiefluss =======================
    # Knoten (Ø 44): PV oben, Netz links, Akku rechts, Haus unten; Mitte (160/138).
    # Leitungen und Rahmen färbt das 40-ms-Intervall in common.yaml, sobald Strom fließt.
    - id: page_flow
      bg_color: 0x070B14
      on_load:
        - lambda: id(flow_active) = true;
      on_unload:
        - lambda: id(flow_active) = false;
      widgets:
        - button:
            x: 6
            y: 4
            width: 34
            height: 32
            styles: st_btn
            on_click:
              - lvgl.page.show: page_main
            widgets:
              - label: { align: CENTER, text: "\U000F0141", text_font: font_icon_m, text_color: 0xCBD5E1 }
        - label:
            align: TOP_MID
            y: 10
            text: "Energiefluss"
            text_font: font_m
            text_color: 0xF8FAFC

        - line: { id: ln_pv,   points: ["160, 84", "160, 138"], line_width: 4, line_color: 0x1E293B, line_rounded: true }
        - line: { id: ln_grid, points: ["82, 138", "160, 138"], line_width: 4, line_color: 0x1E293B, line_rounded: true }
        - line: { id: ln_akku, points: ["238, 138", "160, 138"], line_width: 4, line_color: 0x1E293B, line_rounded: true }
        - line: { id: ln_haus, points: ["160, 138", "160, 192"], line_width: 4, line_color: 0x1E293B, line_rounded: true }
        - obj: { x: 154, y: 132, width: 12, height: 12, radius: 6, bg_color: 0x070B14, border_width: 2, border_color: 0x475569, clickable: false }

        - obj:
            id: node_pv
            styles: st_node
            x: 138
            y: 40
            width: 44
            height: 44
            border_color: 0xFACC15
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0D9C", text_font: font_icon, text_color: 0xFACC15 }
        - obj:
            id: node_grid
            styles: st_node
            x: 38
            y: 116
            width: 44
            height: 44
            border_color: 0x475569
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0D3E", text_font: font_icon, text_color: 0xCBD5E1 }
        - obj:
            id: node_akku
            styles: st_node
            x: 238
            y: 116
            width: 44
            height: 44
