    # ======================= Einstellungen =======================
    - id: page_settings
      bg_color: 0x070B14
      widgets:
        - button:
            x: 6
            y: 4
            width: 34
            height: 32
            styles: st_btn
            on_click:
              - lvgl.page.show: page_main
            widgets:
              - label: { align: CENTER, text: "\U000F0141", text_font: font_icon_m, text_color: 0xCBD5E1 }
        - label:
            align: TOP_MID
            y: 10
            text: "Einstellungen"
            text_font: font_m
            text_color: 0xF8FAFC

        # Wechselrichter
        - obj:
            styles: st_card
            x: 6
            y: 40
            width: 308
            height: 78
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Fronius Wechselrichter (max. 3)", text_color: 0x8391A7 }
              - label: { id: lbl_ip, align: TOP_LEFT, y: 16, width: 196, long_mode: DOT, text: "nicht gesetzt", text_font: font_m, text_color: 0xF8FAFC }
              - button:
                  align: TOP_RIGHT
                  width: 84
                  height: 30
                  styles: st_btn
                  bg_color: 0x2563EB
                  border_width: 0
                  on_click:
                    - lambda: fronius_scan::start();
                  widgets:
                    - label: { align: CENTER, text: "Suchen", text_color: 0xFFFFFF }
              - bar:
                  id: bar_scan
                  align: BOTTOM_MID
                  y: -16
                  width: 100%
                  height: 5
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x1A2335
                  indicator:
                    bg_color: 0x2563EB
              - label: { id: lbl_scan, align: BOTTOM_LEFT, text: "", text_color: 0x8391A7 }

        # Helligkeit
        - obj:
            styles: st_card
            x: 6
            y: 124
            width: 308
            height: 42
            scrollable: false
            widgets:
              - label: { align: LEFT_MID, text: "Helligkeit", text_color: 0x8391A7 }
              - slider:
                  id: sld_brightness
                  align: RIGHT_MID
                  x: -8
                  width: 190
                  height: 8
                  min_value: 10
                  max_value: 100
                  value: 80
                  bg_color: 0x1A2335
                  indicator:
                    bg_color: 0x2563EB
                  knob:
                    bg_color: 0xF8FAFC
                  on_release:
                    - number.set:
                        id: brightness
                        value: !lambda return x;

        # Updates & Info
        - obj:
            styles: st_card
            x: 6
            y: 172
            width: 308
            height: 62
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Automatische Updates", text_color: 0x8391A7 }
              - switch:
                  id: sw_auto_update
                  align: TOP_RIGHT
                  width: 40
                  height: 20
                  bg_color: 0x334155
                  indicator:
                    checked:
                      bg_color: 0x2563EB
                  on_change:
                    - if:
                        condition:
                          lambda: return x;
                        then:
                          - switch.turn_on: auto_update
                        else:
                          - switch.turn_off: auto_update
              - label: { id: lbl_fw_version, align: BOTTOM_LEFT, y: -14, text: "Version ${fw_version}", text_color: 0xF8FAFC }
              - label: { id: lbl_web, align: BOTTOM_LEFT, text: "Web: --", text_color: 0x64748B }
              - button:
                  align: BOTTOM_RIGHT
                  width: 100
                  height: 26
                  styles: st_btn
                  on_click:
                    - if:
                        condition:
                          update.is_available: fw_update
                        then:
                          # Details im Popup zeigen, dort wird installiert
                          - lambda: id(upd_dismissed) = "";
                          - script.execute: update_popup
                        else:
                          - lvgl.label.update: { id: lbl_update_btn, text: "Prüfe …" }
                          - component.update: fw_update
                          - delay: 5s
                          - lvgl.label.update:
                              id: lbl_update_btn
                              text: !lambda |-
                                return id(fw_update).state == update::UPDATE_STATE_AVAILABLE
                                  ? std::string("Update ") + id(fw_update).update_info.latest_version
                                  : std::string("Aktuell");
                  widgets:
                    - label: { id: lbl_update_btn, align: CENTER, text: "Updates prüfen", text_color: 0xF8FAFC }
