# ===========================================================================
#  mksoft PV-Display – gemeinsame Logik für alle Boards
#  Fronius-Abfrage, Netzwerksuche, Einstellungen, Zeit, Auto-Update
#
#  Wird von den Board-Dateien (board-*.yaml) per "packages:" eingebunden.
#  Jede Board-Oberfläche muss dieselben Widget-IDs bereitstellen
#  (lbl_pv, arc_pv, lbl_grid, dot_pv, bar_scan, ...), weil diese Datei sie befüllt.
#
#  Pflicht-Substitutions der Board-Datei:
#    name, friendly_name, project_name, update_manifest,
#    flow_cx, flow_cy, flow_top, flow_bottom, flow_left, flow_right, flow_dot_half
# ===========================================================================

substitutions:
  fw_version: "0.0.0-dev"           # wird beim Release vom Git-Tag überschrieben
  setup_ssid: PV-Display-Setup
  setup_password: mksoft-setup      # steht in der Kundenanleitung

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true         # eindeutiger Hostname je Gerät
  min_version: 2025.7.0
  project:
    name: ${project_name}
    version: ${fw_version}
  includes:
    - fronius_scan.h
    - pv_data.h
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: backlight
            brightness: !lambda return id(brightness).state / 100.0f;
        - lvgl.slider.update:
            id: sld_brightness
            value: !lambda return id(brightness).state;
        - lvgl.widget.update:
            id: sw_auto_update
            state:
              checked: !lambda return id(auto_update).state;
        - script.execute: update_ip_label
        # Update-Popup bei jeder Statusänderung der Firmware-Entität neu zeichnen –
        # auch während der Installation (die blockiert die normale Anzeige)
        - lambda: |-
            id(fw_update)->add_on_state_callback([]() { id(update_popup)->execute(); });
        # Ersteinrichtung: noch kein Wechselrichter gespeichert -> Einrichtungsseite
        - if:
            condition:
              lambda: |-
                return id(fronius_ip).state.empty() && id(fronius_ip2).state.empty() && id(fronius_ip3).state.empty();
            then:
              - lambda: id(setup_mode) = true;
              - lvgl.page.show:
                  id: page_setup
                  animation: NONE
              - script.execute: setup_render

logger:
  level: INFO

# ---------------------------------------------------------------------------
#  Netzwerk, Einrichtung, Updates
# ---------------------------------------------------------------------------

wifi:
  # Keine fest eingetragenen Netze: der Kunde richtet WLAN über den Hotspot ein
  ap:
    ssid: ${setup_ssid}
    password: ${setup_password}
  on_connect:
    - lvgl.widget.hide: hint_box
    - lambda: |-
        if (id(fronius_ip).state.empty() && id(fronius_ip2).state.empty() && id(fronius_ip3).state.empty()) {
          id(scan_repair) = false;
          fronius_scan::start();
        }
    - script.execute: setup_render
  on_disconnect:
    - lvgl.widget.show: hint_box
    - script.execute: setup_render

captive_portal:

# Eigene Handy-Oberfläche (web/) statt der ESPHome-Standardseite.
# Funktioniert ohne Internet; die ESPHome-Ansicht ist dort über
# "Erweitert" zuschaltbar (lädt dann von oi.esphome.io).
web_server:
  port: 80
  version: 3
  js_url: ""                        # Standardoberfläche nicht automatisch laden
  js_include: web/dist/dashboard.js
  css_include: web/dist/dashboard.css

safe_mode:

# Release-Firmware: Updates nur vom eigenen Update-Server.
# Netzwerk-OTA aus ESPHome gibt es nur im Entwicklungs-Build (pv-display-dev.yaml),
# weil die Release-Firmware öffentlich herunterladbar ist und ein darin
# enthaltenes OTA-Passwort ausgelesen werden könnte.
ota:
  - platform: http_request

http_request:
  useragent: pv-display/${fw_version}
  timeout: 3s
  verify_ssl: true

update:
  - platform: http_request
    id: fw_update
    name: Firmware
    source: ${update_manifest}
    update_interval: 6h
    on_update_available:
      - lvgl.label.update:
          id: lbl_update_btn
          text: !lambda |-
            const auto &i = id(fw_update).update_info;
            return version_newer(i.latest_version, i.current_version) ? "Update " + i.latest_version
                                                                      : std::string("Aktuell");
      - script.execute: update_popup

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Vienna
    servers:
      - 0.at.pool.ntp.org
      - 1.at.pool.ntp.org
      - pool.ntp.org
    on_time_sync:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda return id(sntp_time).now().strftime("%H:%M");
    on_time:
      - seconds: 0
        then:
          - lvgl.label.update:
              id: lbl_time
              text: !lambda return id(sntp_time).now().strftime("%H:%M");
      # Nächtliches Auto-Update um 03:17
      - seconds: 0
        minutes: 17
        hours: 3
        then:
          - if:
              condition:
                switch.is_on: auto_update
              then:
                - component.update: fw_update
                - delay: 30s
                - if:
                    condition:
                      lambda: |-
                        const auto &i = id(fw_update).update_info;
                        return id(fw_update).state == update::UPDATE_STATE_AVAILABLE &&
                               version_newer(i.latest_version, i.current_version);
                    then:
                      - update.perform: fw_update

globals:
  - id: poll_slot                 # welcher Wechselrichter gerade abgefragt wird (-1 = keiner)
    type: int
    initial_value: "-1"
  - id: scan_repair               # true = automatische Suche, ersetzt nur fehlende Wechselrichter
    type: bool
    initial_value: "false"
  - id: upd_dismissed             # mit "Später" weggeklickte Version (bis zum Neustart)
    type: std::string
    initial_value: '""'
  - id: setup_mode                # true = Einrichtungsseite ist aktiv (Ersteinrichtung)
    type: bool
    initial_value: "false"
  - id: setup_exit                # von setup_render gesetzt: jetzt zur Übersicht wechseln
    type: bool
    initial_value: "false"
  - id: flow_active               # Animation nur rechnen, wenn Seite sichtbar
    type: bool
    initial_value: "false"

# ---------------------------------------------------------------------------
#  Einstellungen (dauerhaft gespeichert, auch über Weboberfläche änderbar)
# ---------------------------------------------------------------------------

# Bis zu drei Wechselrichter mit eigener Solar API (z. B. Gen24 + Symo).
# Hängen mehrere an einem gemeinsamen Datamanager, nur dessen IP eintragen.
text:
  - platform: template
    id: fronius_ip
    name: Fronius IP              # Name nicht ändern – sonst geht die gespeicherte IP verloren
    icon: mdi:solar-power
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    on_value:
      - lambda: pv::on_ip_changed(0, x);
      - script.execute: update_ip_label
  - platform: template
    id: fronius_ip2
    name: Fronius IP 2
    icon: mdi:solar-power
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    on_value:
      - lambda: pv::on_ip_changed(1, x);
      - script.execute: update_ip_label
  - platform: template
    id: fronius_ip3
    name: Fronius IP 3
    icon: mdi:solar-power
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 32
    on_value:
      - lambda: pv::on_ip_changed(2, x);
      - script.execute: update_ip_label

number:
  - platform: template
    id: brightness
    name: Helligkeit
    icon: mdi:brightness-6
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 80
    on_value:
      - light.turn_on:
          id: backlight
          brightness: !lambda return x / 100.0f;

  # Spitzenleistung der Anlage – Basis für den Ring auf der Hauptseite
  - platform: template
    id: pv_peak
    name: Anlagenleistung
    icon: mdi:solar-panel-large
    mode: box
    min_value: 1
    max_value: 100
    step: 0.1
    unit_of_measurement: kWp
    optimistic: true
    restore_value: true
    initial_value: 10

switch:
  - platform: template
    id: auto_update
    name: Automatische Updates
    icon: mdi:update
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF   # Auto-Update muss der Kunde selbst einschalten

button:
  - platform: template
    name: Wechselrichter suchen
    icon: mdi:magnify
    on_press:
      - lambda: |-
          id(scan_repair) = false;
          fronius_scan::start();
  # Für die Handy-Oberfläche: die Update-Entität kann per REST nur installieren
  - platform: template
    name: Nach Updates suchen
    icon: mdi:update
    entity_category: config
    on_press:
      - component.update: fw_update
  - platform: restart
    name: Neustart

text_sensor:
  # Fortschritt der Wechselrichter-Suche – für die Handy-Oberfläche
  - platform: template
    id: scan_status
    name: Suchstatus
    icon: mdi:magnify
    entity_category: diagnostic
    update_interval: never
  - platform: wifi_info
    ip_address:
      id: own_ip
      on_value:
        - lvgl.label.update:
            id: lbl_web
            text:
              format: "Web: http://%s"
              args: [ x.c_str() ]

# ---------------------------------------------------------------------------
#  Fronius-Daten
# ---------------------------------------------------------------------------

binary_sensor:
  - platform: template
    id: fronius_online
    name: Fronius erreichbar
    device_class: connectivity      # an = alle eingetragenen Wechselrichter liefern Daten

sensor:
  - platform: template
    id: p_pv
    name: PV Leistung
    unit_of_measurement: W
    device_class: power
    update_interval: never
    on_value:
      # Unter 1 kW in Watt, darüber in kW (pv_data.h)
      - lambda: |-
          lv_label_set_text(id(lbl_pv), pv::power_value(x).c_str());
          lv_label_set_text(id(lbl_pv_unit), pv::power_unit(x));
          lv_label_set_text(id(lbl_f_pv), pv::power_text(x).c_str());
      - lvgl.arc.update:
          id: arc_pv
          value: !lambda return (int) std::min(100.0f, std::max(0.0f, x / (id(pv_peak).state * 10.0f)));

  - platform: template
    id: p_grid
    name: Netz
    unit_of_measurement: W
    device_class: power
    update_interval: never
    on_value:
      - lambda: |-
          lv_label_set_text(id(lbl_grid), pv::power_value(x).c_str());
          lv_label_set_text(id(lbl_grid_unit), pv::power_unit(x));
          lv_label_set_text(id(lbl_f_grid), pv::power_text(x).c_str());
          const char *sub = fabsf(x) < 20 ? "ausgeglichen" : (x > 0 ? "Bezug" : "Einspeisung");
          lv_label_set_text(id(lbl_grid_sub), sub);
          lv_label_set_text(id(lbl_f_grid_sub), sub);
          lv_color_t c = fabsf(x) < 20 ? lv_color_hex(0xF1F5F9)
                       : (x > 0 ? lv_color_hex(0xF87171) : lv_color_hex(0x4ADE80));
          lv_obj_set_style_text_color(id(lbl_grid), c, 0);
          lv_obj_set_style_text_color(id(lbl_f_grid), c, 0);
          lv_obj_set_style_bg_color(id(dot_grid), c, 0);

  - platform: template
    id: p_load
    name: Verbrauch
    unit_of_measurement: W
    device_class: power
    update_interval: never
    on_value:
      - lambda: |-
          lv_label_set_text(id(lbl_load), pv::power_value(x).c_str());
          lv_label_set_text(id(lbl_load_unit), pv::power_unit(x));
          lv_label_set_text(id(lbl_f_load), pv::power_text(x).c_str());

  - platform: template
    id: p_akku
    name: Akku Leistung
    unit_of_measurement: W
    device_class: power
    update_interval: never
    on_value:
      - lambda: |-
          const std::string txt = fabsf(x) < 20 ? std::string("Standby")
                                : std::string(x < 0 ? "lädt " : "entlädt ") + pv::power_text(x);
          lv_label_set_text(id(lbl_akku_sub), txt.c_str());
          lv_label_set_text(id(lbl_f_akku), txt.c_str());

  - platform: template
    id: soc
    name: Akku Ladestand
    unit_of_measurement: "%"
    device_class: battery
    update_interval: never
    on_value:
      # Texte mit Prozentzeichen als Lambda: ESPHomes format-Prüfung
      # verwechselt "%%" mit einem Platzhalter
      - lvgl.label.update:
          id: lbl_soc
          text: !lambda |-
            return str_sprintf("%.0f%%", x);
      - lvgl.label.update:
          id: lbl_f_soc
          text: !lambda |-
            return str_sprintf("%.0f %%", x);

  - platform: template
    id: autarkie
    name: Autarkie
    unit_of_measurement: "%"
    update_interval: never
    on_value:
      - lvgl.label.update:
          id: lbl_autarkie
          text: !lambda |-
            return str_sprintf("%.0f %% autark", x);

  - platform: template
    id: e_day
    name: Ertrag heute
    unit_of_measurement: kWh
    device_class: energy
    update_interval: never
    on_value:
      - lvgl.label.update:
          id: lbl_eday
          text:
            format: "Heute %.1f kWh"
            args: [ x ]

script:
  # Werte aller Wechselrichter zusammenrechnen und anzeigen
  - id: publish_totals
    then:
      - lambda: |-
          const uint32_t now = millis();
          const std::string ips[3] = {id(fronius_ip).state, id(fronius_ip2).state, id(fronius_ip3).state};

          int configured = 0, fresh = 0;
          bool missing_long = false;
          for (int i = 0; i < 3; i++) {
            if (ips[i].empty()) continue;
            configured++;
            if (pv::is_fresh(pv::slots[i], now)) fresh++;
            // last_ok == 0 heißt: seit dem Start nie erreicht -> zählt ab Systemstart
            else if (pv::slots[i].fails >= pv::BACKOFF_AFTER && now - pv::slots[i].last_ok > 120000) missing_long = true;
          }

          // Status-Punkt: grün = alle, orange = einige, rot = keiner liefert Daten
          const uint32_t col = fresh == 0 ? 0xEF4444 : (fresh < configured ? 0xF59E0B : 0x22C55E);
          lv_obj_set_style_bg_color(id(dot_status), lv_color_hex(col), 0);
          id(fronius_online).publish_state(configured > 0 && fresh == configured);

          // Fehlt ein Wechselrichter länger als 2 min: automatisch neu suchen
          // (IP evtl. per DHCP geändert), höchstens alle 10 min
          static uint32_t last_auto_scan = 0;
          if (missing_long && !fronius_scan::is_running() &&
              (last_auto_scan == 0 || now - last_auto_scan > 600000)) {
            last_auto_scan = now;
            id(scan_repair) = true;
            fronius_scan::start();
          }

          const pv::Totals t = pv::totals(now);
          if (!t.valid) return;   // letzte Werte stehen lassen, Punkt ist rot
          id(p_pv).publish_state(t.pv);
          if (t.has_grid) id(p_grid).publish_state(t.grid);
          id(p_load).publish_state(t.load);
          if (t.has_akku) id(p_akku).publish_state(t.akku);
          if (!std::isnan(t.soc)) id(soc).publish_state(t.soc);
          if (!std::isnan(t.autarky)) id(autarkie).publish_state(t.autarky);
          if (!std::isnan(t.eday_kwh)) id(e_day).publish_state(t.eday_kwh);

  - id: update_ip_label
    then:
      - lambda: |-
          const std::string txt = pv::ip_list({id(fronius_ip).state, id(fronius_ip2).state, id(fronius_ip3).state});
          lv_label_set_text(id(lbl_ip), txt.c_str());

  # Update-Popup über allen Seiten (top_layer in den Board-Dateien)
  - id: update_popup
    then:
      - lambda: |-
          auto show = [](lv_obj_t *o, bool visible) {
            if (visible) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto *fw = id(fw_update);
          const auto &info = fw->update_info;

          // Einstellungen: installierte und ggf. gefundene Version anzeigen
          {
            const std::string cur = info.current_version.empty() ? std::string("${fw_version}") : info.current_version;
            const bool avail = fw->state == update::UPDATE_STATE_AVAILABLE && version_newer(info.latest_version, cur);
            const std::string v = avail ? "Version " + cur + " \xC2\xB7 " + info.latest_version + " verfügbar"
                                        : "Version " + cur;
            lv_label_set_text(id(lbl_fw_version), v.c_str());
          }

          if (fw->state == update::UPDATE_STATE_INSTALLING) {
            lv_label_set_text(id(upd_title), "Update wird installiert");
            lv_label_set_text(id(upd_text), "Bitte nicht ausschalten.\nDas Display startet danach neu.");
            const int p = info.has_progress ? (int) info.progress : 0;
            lv_bar_set_value(id(upd_bar), p, LV_ANIM_OFF);
            lv_label_set_text(id(upd_pct), str_sprintf("%d %%", p).c_str());
            show(id(upd_bar), true);
            show(id(upd_pct), true);
            show(id(upd_buttons), false);
            show(id(upd_popup), true);
            // Die Installation blockiert die Hauptschleife: sofort zeichnen
            lv_refr_now(nullptr);
            return;
          }

          // ESPHome meldet "verfügbar", sobald die Versionsnummer nur anders ist – wir zeigen nur neuere an
          const std::string cur_v = info.current_version.empty() ? std::string("${fw_version}") : info.current_version;
          const bool available = fw->state == update::UPDATE_STATE_AVAILABLE && version_newer(info.latest_version, cur_v);
          if (!available || id(setup_mode) || info.latest_version == id(upd_dismissed)) {
            show(id(upd_popup), false);
            return;
          }

          lv_label_set_text(id(upd_title), str_sprintf("Version %s verfügbar", info.latest_version.c_str()).c_str());
          std::string txt = "Installiert: " + (info.current_version.empty() ? std::string("${fw_version}") : info.current_version);
          // Beschreibung aus dem Release (Tag-Nachricht + Commits), Zeilen an die Displaygröße anpassen
          std::vector<std::string> lines = upd_summary_lines(info.summary, ${upd_lines}, ${upd_line_chars});
          if (!lines.empty()) txt += "\n";
          for (const auto &l : lines) txt += "\n" + l;
          if (fw->status_has_error()) txt += "\n\nDer letzte Installationsversuch ist fehlgeschlagen.";
          else if (id(auto_update).state) txt += "\n\nSonst wird es heute Nacht automatisch installiert.";
          lv_label_set_text(id(upd_text), txt.c_str());
          show(id(upd_bar), false);
          show(id(upd_pct), false);
          show(id(upd_buttons), true);
          show(id(upd_popup), true);

  # Ersteinrichtung: Einrichtungsseite je nach Zustand befüllen.
  # Läuft nur, solange setup_mode aktiv ist (alle 300 ms + bei WLAN-Wechsel).
  - id: setup_render
    then:
      - lambda: |-
          if (!id(setup_mode)) return;
          using fronius_scan::State;

          auto set = [](lv_obj_t *o, const std::string &t) {
            if (strcmp(lv_label_get_text(o), t.c_str()) != 0) lv_label_set_text(o, t.c_str());
          };
          auto show = [](lv_obj_t *o, bool visible) {
            if (visible) lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };

          const std::string ips[3] = {id(fronius_ip).state, id(fronius_ip2).state, id(fronius_ip3).state};
          int count = 0;
          for (const auto &ip : ips) count += ip.empty() ? 0 : 1;
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const std::string own = id(own_ip).state;
          const std::string web = own.empty() ? std::string("–") : "http://" + own;
          static uint32_t done_at = 0;

          // Fertig: gefunden oder über die Weboberfläche eingetragen
          if (count > 0) {
            if (done_at == 0) done_at = millis();
            set(id(setup_step), "Einrichtung abgeschlossen");
            set(id(setup_text), count == 1 ? std::string("1 Wechselrichter gefunden")
                                           : str_sprintf("%d Wechselrichter gefunden", count));
            set(id(setup_ip_caption), "Weboberfläche");
            set(id(setup_ip), web);
            set(id(setup_status), pv::ip_list({ips[0], ips[1], ips[2]}));
            lv_bar_set_value(id(setup_bar), 100, LV_ANIM_OFF);
            show(id(setup_bar), true);
            show(id(btn_setup_retry), false);
            // Ergebnis 5 s stehen lassen, damit man die IP abschreiben kann
            if (millis() - done_at > 5000) {
              done_at = 0;
              id(setup_mode) = false;
              id(setup_exit) = true;
            }
            return;
          }
          done_at = 0;

          // Schritt 1: WLAN
          if (!wifi_ok) {
            set(id(setup_step), "Schritt 1 von 2 · WLAN");
            set(id(setup_text), "Mit dem Handy das WLAN \"${setup_ssid}\" verbinden "
                                "(Passwort: ${setup_password}) und das eigene WLAN auswählen.");
            set(id(setup_ip_caption), "Öffnet sich keine Seite:");
            set(id(setup_ip), "http://192.168.4.1");
            set(id(setup_status), "");
            show(id(setup_bar), false);
            show(id(btn_setup_retry), false);
            return;
          }

          // Schritt 2: Wechselrichter suchen
          set(id(setup_step), "Schritt 2 von 2 · Wechselrichter");
          set(id(setup_ip_caption), "Weboberfläche dieses Displays");
          set(id(setup_ip), web);
          const State st = fronius_scan::state();
          if (st == State::NOT_FOUND) {
            set(id(setup_text), "Kein Wechselrichter gefunden. Ist er eingeschaltet und im selben "
                                "Netzwerk? Die IP kann auch über die Weboberfläche eingetragen werden.");
            set(id(setup_status), "");
            show(id(setup_bar), false);
            show(id(btn_setup_retry), true);
          } else {
            const int p = st == State::RUNNING ? fronius_scan::progress() : 0;
            set(id(setup_text), "Fronius-Wechselrichter im Netzwerk werden gesucht …");
            set(id(setup_status), st == State::RUNNING ? str_sprintf("%d %%", p) : std::string("Suche startet …"));
            lv_bar_set_value(id(setup_bar), p, LV_ANIM_ON);
            show(id(setup_bar), true);
            show(id(btn_setup_retry), false);
          }
      - if:
          condition:
            lambda: return id(setup_exit);
          then:
            - lambda: id(setup_exit) = false;
            - lvgl.page.show: page_main
            - script.execute: update_popup

interval:
  # Wechselrichter reihum abfragen: alle 2 s einer (bei zweien also je alle 4 s).
  # Die Abfrage blockiert kurz – deshalb nie mehrere auf einmal.
  - interval: 2s
    then:
      - lambda: |-
          id(poll_slot) = -1;
          if (!wifi::global_wifi_component->is_connected() || fronius_scan::is_running()) return;
          const std::string ips[3] = {id(fronius_ip).state, id(fronius_ip2).state, id(fronius_ip3).state};
          static int last = -1;
          const uint32_t now = millis();
          for (int k = 1; k <= 3; k++) {
            const int i = (last + k + 3) % 3;
            if (!ips[i].empty() && pv::should_poll(i, now)) {
              last = i;
              id(poll_slot) = i;
              pv::mark_try(i, now);
              return;
            }
          }
      - if:
          condition:
            lambda: return id(poll_slot) >= 0;
          then:
            - http_request.get:
                url: !lambda |-
                  const std::string ips[3] = {id(fronius_ip).state, id(fronius_ip2).state, id(fronius_ip3).state};
                  return "http://" + ips[id(poll_slot)] + "/solar_api/v1/GetPowerFlowRealtimeData.fcgi";
                capture_response: true
                max_response_buffer_size: 4kB
                on_response:
                  then:
                    - lambda: |-
                        const int i = id(poll_slot);
                        if (response->status_code != 200 || !pv::parse(i, body, millis())) pv::mark_fail(i);
                    - script.execute: publish_totals
                on_error:
                  then:
                    - lambda: pv::mark_fail(id(poll_slot));
                    - script.execute: publish_totals

  # Animation der Energiefluss-Seite (~25 fps, nur wenn sichtbar)
  - interval: 40ms
    then:
      - lambda: |-
          if (!id(flow_active)) return;
          static float phase[4] = {0.0f, 0.25f, 0.5f, 0.75f};

          // Mehr Leistung = schnellere Punkte
          auto move = [&](lv_obj_t *dot, int i, float x0, float y0, float x1, float y1,
                          float power, bool towards_end) {
            if (std::isnan(power) || fabsf(power) < 20) {
              lv_obj_add_flag(dot, LV_OBJ_FLAG_HIDDEN);
              return;
            }
            lv_obj_clear_flag(dot, LV_OBJ_FLAG_HIDDEN);
            phase[i] += 0.012f + std::min(fabsf(power) / 6000.0f, 1.0f) * 0.035f;
            if (phase[i] >= 1.0f) phase[i] -= 1.0f;
            const float t = towards_end ? phase[i] : 1.0f - phase[i];
            lv_obj_set_pos(dot, (lv_coord_t) (x0 + (x1 - x0) * t - ${flow_dot_half}),
                                (lv_coord_t) (y0 + (y1 - y0) * t - ${flow_dot_half}));
          };

          // Alle Segmente laufen Knoten -> Mitte, Haus: Mitte -> Knoten (Koordinaten je Board)
          const float g = id(p_grid).state;   // > 0 Bezug, < 0 Einspeisung
          const float a = id(p_akku).state;   // > 0 entlädt, < 0 lädt
          move(id(dot_pv),   0, ${flow_cx}, ${flow_top}, ${flow_cx}, ${flow_cy}, id(p_pv).state, true);
          move(id(dot_grid), 1, ${flow_left}, ${flow_cy}, ${flow_cx}, ${flow_cy}, g, g > 0);
          move(id(dot_akku), 2, ${flow_right}, ${flow_cy}, ${flow_cx}, ${flow_cy}, a, a > 0);
          move(id(dot_haus), 3, ${flow_cx}, ${flow_cy}, ${flow_cx}, ${flow_bottom}, id(p_load).state, true);

  # Fortschritt der Wechselrichter-Suche ins Display übernehmen
  - interval: 300ms
    then:
      - lambda: |-
          using fronius_scan::State;
          static State last = State::IDLE;
          const State st = fronius_scan::state();

          std::string msg;
          if (st == State::RUNNING) {
            lv_bar_set_value(id(bar_scan), fronius_scan::progress(), LV_ANIM_ON);
            msg = str_sprintf("Suche läuft … %d %%", fronius_scan::progress());
          } else if (st == State::FOUND) {
            const std::vector<std::string> found = fronius_scan::take_results();
            template_::TemplateText *fields[3] = {id(fronius_ip), id(fronius_ip2), id(fronius_ip3)};
            auto set_ip = [&](int i, const std::string &ip) {
              if (fields[i]->state == ip) return;
              auto call = fields[i]->make_call();
              call.set_value(ip);
              call.perform();
            };

            if (!id(scan_repair)) {
              // Manuelle Suche (oder Ersteinrichtung): Liste komplett übernehmen
              for (int i = 0; i < 3; i++) set_ip(i, i < (int) found.size() ? found[i] : std::string());
            } else {
              // Automatische Suche: nur fehlende/leere Plätze mit neuen IPs füllen,
              // damit ein kurz abgeschalteter Wechselrichter nicht aus der Liste fällt
              const uint32_t now = millis();
              for (const std::string &ip : found) {
                bool known = false;
                for (auto *f : fields) known |= (f->state == ip);
                if (known) continue;
                for (int i = 0; i < 3; i++) {
                  const bool empty = fields[i]->state.empty();
                  const bool dead = !empty && !pv::is_fresh(pv::slots[i], now) && pv::slots[i].fails >= pv::BACKOFF_AFTER;
                  if (empty || dead) {
                    set_ip(i, ip);
                    break;
                  }
                }
              }
            }
            lv_bar_set_value(id(bar_scan), 100, LV_ANIM_ON);
            msg = found.size() == 1 ? std::string("1 Wechselrichter gefunden")
                                    : str_sprintf("%u Wechselrichter gefunden", (unsigned) found.size());
          } else if (st == State::NOT_FOUND && last != st) {
            msg = "Kein Wechselrichter gefunden";
          }
          last = st;
          // Display und Handy-Oberfläche nur bei Änderung aktualisieren
          if (!msg.empty() && msg != id(scan_status).state) {
            lv_label_set_text(id(lbl_scan), msg.c_str());
            id(scan_status).publish_state(msg);
          }
      - if:
          condition:
            lambda: return id(setup_mode);
          then:
            - script.execute: setup_render

