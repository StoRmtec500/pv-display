# ===========================================================================
#  Firmware-Release für alle PV-Display-Boards
#
#  Auslöser: Git-Tag  vX.Y.Z  (z. B.  git tag -a v1.2.0 -m "CYD-Unterstützung")
#  Ergebnis pro Board:
#    https://update.mksoft.at/<device>/manifest.json  (+ .ota.bin / .factory.bin)
#  und ein GitHub Release mit allen Dateien.
#
#  Neues Board hinzufügen: board-*.yaml anlegen und unten in der Matrix eintragen.
# ===========================================================================

name: Firmware Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 1.2.0"
        required: true

permissions:
  contents: write     # GitHub Release anlegen + Branch gh-pages schreiben

concurrency:
  group: firmware-release
  cancel-in-progress: false

env:
  UPDATE_DOMAIN: update.mksoft.at
  BASE_URL: https://update.mksoft.at

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      summary: ${{ steps.v.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ungültige Version '$V' – erwartet z. B. 1.2.1"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

          # Beschreibung fürs Update-Popup:
          #   1. Zeile  = Nachricht eines annotierten Tags (git tag -a … -m "…"), falls vorhanden
          #   danach    = Commit-Nachrichten seit dem vorigen Release als "- …"-Liste
          # Gekürzt wird später in tools/make-manifest.ts (max. 250 Bytes, ganze Zeilen).
          TAG="v$V"
          REF="$TAG"; git rev-parse -q --verify "$REF^{commit}" >/dev/null || REF=HEAD
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$REF^" 2>/dev/null || true)
          HEADLINE=""
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            HEADLINE=$(git tag -l --format='%(contents:subject)' "$TAG")
          fi
          # Nichtssagende Commits ausfiltern (Versionsnummern, "push", "test", GitHub-Web-Standardtexte)
          if [ -n "$PREV" ]; then RANGE="$PREV..$REF"; else RANGE="$REF"; fi
          CHANGES=$(git log --no-merges --pretty='%s' "$RANGE" \
            | grep -viE '^(v?[0-9.]+|push|test|wip|fix|\.|add files via upload|(create|delete|update) [^ ]+\.[a-z0-9]+)$' \
            | grep -vxF "$HEADLINE" \
            | head -n 8 | sed 's/^/- /' || true)
          # Alles weggefiltert und keine Tag-Nachricht: wenigstens die Überschrift des Commits zeigen
          if [ -z "$HEADLINE$CHANGES" ]; then
            CHANGES="- $(git log -1 --pretty='%s' "$REF")"
          fi
          echo "Vorheriges Release: ${PREV:-keins}"

          # Schutz: derselbe Commit wurde schon unter einer anderen Version veröffentlicht.
          # Sonst bieten Geräte "Updates" ohne Änderung an (1.5.2 -> 1.5.3 mit gleichem Inhalt).
          OTHER=$(git tag --points-at "$(git rev-parse "$REF^{commit}")" --list 'v[0-9]*' | grep -vxF "$TAG" | head -n 1 || true)
          if [ -n "$OTHER" ]; then
            echo "::error::Dieser Commit ist bereits als $OTHER veröffentlicht. Erst Änderungen committen, dann neu taggen."
            exit 1
          fi
          {
            echo "summary<<__SUMMARY_END__"
            [ -n "$HEADLINE" ] && echo "$HEADLINE"
            [ -n "$CHANGES" ] && echo "$CHANGES"
            [ -z "$HEADLINE$CHANGES" ] && echo "Version $V"
            echo "__SUMMARY_END__"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: board-4848s040.yaml
            device: pv-display          # bestehender Pfad – nicht ändern
            title: PV Display 4"
            chip: ESP32-S3              # muss zum Chip passen, sonst kein Update
          - config: board-2432s028.yaml
            device: pv-display-cyd
            title: PV Display 2.8"
            chip: ESP32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            .esphome/build
          key: esphome-${{ matrix.device }}-${{ hashFiles(matrix.config, 'common.yaml', 'fronius_scan.h') }}
          restore-keys: esphome-${{ matrix.device }}-

      # ESPHOME_VERSION als Repository-Variable setzen, um die Version festzunageln
      - name: ESPHome installieren
        env:
          ESPHOME_VERSION: ${{ vars.ESPHOME_VERSION }}
        run: pip install "esphome${ESPHOME_VERSION:+==$ESPHOME_VERSION}"

      # Handy-Oberfläche (web/src) neu bauen, damit web/dist zum Stand passt
      - name: Weboberfläche bauen
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build:web

      - name: Firmware kompilieren
        env:
          CONFIG: ${{ matrix.config }}
          V: ${{ needs.version.outputs.version }}
        run: esphome -s fw_version "$V" compile "$CONFIG"

      - name: Dateien einsammeln
        env:
          CONFIG: ${{ matrix.config }}
          DEVICE: ${{ matrix.device }}
          V: ${{ needs.version.outputs.version }}
        run: |
          NAME=$(grep -m1 -E '^\s+name: ' "$CONFIG" | awk '{print $2}')
          OTA=$(find ".esphome/build/$NAME" -name firmware.ota.bin | head -n1)
          FACTORY=$(find ".esphome/build/$NAME" -name firmware.factory.bin | head -n1)
          test -s "$OTA" && test -s "$FACTORY" || { echo "Firmware-Dateien für $NAME nicht gefunden"; exit 1; }
          mkdir -p "site/$DEVICE"
          cp "$OTA"     "site/$DEVICE/$DEVICE-$V.ota.bin"
          cp "$FACTORY" "site/$DEVICE/$DEVICE-$V.factory.bin"
          echo "Größe OTA-Image: $(stat -c %s "$OTA") Bytes"

      # Freitexte (Titel, Tag-Nachricht) nur über env: übergeben, nie direkt
      # mit ${{ }} in den Befehl – sonst brechen Anführungszeichen das Skript
      - name: Manifest erzeugen
        env:
          DEVICE: ${{ matrix.device }}
          V: ${{ needs.version.outputs.version }}
          TITLE: ${{ matrix.title }}
          CHIP: ${{ matrix.chip }}
          SUMMARY: ${{ needs.version.outputs.summary }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}
        # Freitexte mit "=" übergeben: Werte, die mit "-" beginnen (Commit-Liste),
        # würde der Argument-Parser sonst als neue Option deuten
        run: |
          npm run manifest -- \
            --dir "site/$DEVICE" \
            --base-url "$BASE_URL/$DEVICE" \
            --name="$TITLE" \
            --version "$V" \
            --chip "$CHIP" \
            --ota "$DEVICE-$V.ota.bin" \
            --factory "$DEVICE-$V.factory.bin" \
            --summary="$SUMMARY" \
            --release-url "$RELEASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.device }}
          path: site
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: site
          merge-multiple: true

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          find site -name "*.bin" | sort
          # Manifeste umbenennen, damit sie im Release unterscheidbar sind
          mkdir -p assets
          for d in site/*/; do
            dev=$(basename "$d")
            cp "$d"/*.bin assets/
            cp "$d/manifest.json" "assets/$dev-manifest.json"
          done
          gh release create "v$V" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PV Display $V" --generate-notes \
            || gh release upload "v$V" assets/* --repo "$GITHUB_REPOSITORY" --clobber

      # Update-Server = Branch gh-pages. In den Repo-Einstellungen unter Pages:
      # Source "Deploy from a branch", Branch "gh-pages", Ordner "/ (root)".
      # Der Branch wird bei jedem Release komplett neu geschrieben (nur aktuelle Firmware).
      - name: Update-Server veröffentlichen (Branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: ${{ env.UPDATE_DOMAIN }}
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Firmware ${{ needs.version.outputs.version }}
