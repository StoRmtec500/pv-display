# ===========================================================================
#  Firmware-Release für alle PV-Display-Boards
#
#  Auslöser: Git-Tag  vX.Y.Z  (z. B.  git tag -a v1.2.0 -m "CYD-Unterstützung")
#  Ergebnis pro Board:
#    https://update.mksoft.at/<device>/manifest.json  (+ .ota.bin / .factory.bin)
#  und ein GitHub Release mit allen Dateien.
#
#  Neues Board hinzufügen: board-*.yaml anlegen und unten in der Matrix eintragen.
# ===========================================================================

name: Firmware Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 1.2.0"
        required: true

permissions:
  contents: write     # GitHub Release anlegen
  pages: write        # Update-Server veröffentlichen
  id-token: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

env:
  BASE_URL: https://update.mksoft.at

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      summary: ${{ steps.v.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            V="${INPUT_VERSION#v}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ungültige Version '$V' – erwartet z. B. 1.2.1"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Tag-Nachricht als Update-Hinweis am Display / in der Weboberfläche
          S=$(git tag -l --format='%(contents:subject)' "v$V" 2>/dev/null || true)
          echo "summary=${S:-Version $V}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: board-4848s040.yaml
            device: pv-display          # bestehender Pfad – nicht ändern
            title: PV Display 4"
          - config: board-2432s028.yaml
            device: pv-display-cyd
            title: PV Display 2.8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            .esphome/build
          key: esphome-${{ matrix.device }}-${{ hashFiles(matrix.config, 'common.yaml', 'fronius_scan.h') }}
          restore-keys: esphome-${{ matrix.device }}-

      # ESPHOME_VERSION als Repository-Variable setzen, um die Version festzunageln
      - name: ESPHome installieren
        env:
          ESPHOME_VERSION: ${{ vars.ESPHOME_VERSION }}
        run: pip install "esphome${ESPHOME_VERSION:+==$ESPHOME_VERSION}"

      - name: Firmware kompilieren
        env:
          CONFIG: ${{ matrix.config }}
          V: ${{ needs.version.outputs.version }}
        run: esphome -s fw_version "$V" compile "$CONFIG"

      - name: Dateien einsammeln
        env:
          CONFIG: ${{ matrix.config }}
          DEVICE: ${{ matrix.device }}
          V: ${{ needs.version.outputs.version }}
        run: |
          NAME=$(grep -m1 -E '^\s+name: ' "$CONFIG" | awk '{print $2}')
          OTA=$(find ".esphome/build/$NAME" -name firmware.ota.bin | head -n1)
          FACTORY=$(find ".esphome/build/$NAME" -name firmware.factory.bin | head -n1)
          test -s "$OTA" && test -s "$FACTORY" || { echo "Firmware-Dateien für $NAME nicht gefunden"; exit 1; }
          mkdir -p "site/$DEVICE"
          cp "$OTA"     "site/$DEVICE/$DEVICE-$V.ota.bin"
          cp "$FACTORY" "site/$DEVICE/$DEVICE-$V.factory.bin"
          echo "Größe OTA-Image: $(stat -c %s "$OTA") Bytes"

      # Freitexte (Titel, Tag-Nachricht) nur über env: übergeben, nie direkt
      # mit ${{ }} in den Befehl – sonst brechen Anführungszeichen das Skript
      - name: Manifest erzeugen
        env:
          DEVICE: ${{ matrix.device }}
          V: ${{ needs.version.outputs.version }}
          TITLE: ${{ matrix.title }}
          SUMMARY: ${{ needs.version.outputs.summary }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run manifest -- \
            --dir "site/$DEVICE" \
            --base-url "$BASE_URL/$DEVICE" \
            --name "$TITLE" \
            --version "$V" \
            --ota "$DEVICE-$V.ota.bin" \
            --factory "$DEVICE-$V.factory.bin" \
            --summary "$SUMMARY" \
            --release-url "$RELEASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.device }}
          path: site
          retention-days: 7

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: site
          merge-multiple: true

      - name: GitHub Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          find site -name "*.bin" | sort
          # Manifeste umbenennen, damit sie im Release unterscheidbar sind
          mkdir -p assets
          for d in site/*/; do
            dev=$(basename "$d")
            cp "$d"/*.bin assets/
            cp "$d/manifest.json" "assets/$dev-manifest.json"
          done
          gh release create "v$V" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PV Display $V" --generate-notes \
            || gh release upload "v$V" assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
