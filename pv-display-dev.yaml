# ===========================================================================
#  Entwicklungs-Build für den Schreibtisch
#  = Release-Konfiguration + Netzwerk-OTA aus ESPHome + ausführliches Log
#
#  Flashen:  esphome run pv-display-dev.yaml
#  Wird NIE über die Update-Pipeline verteilt.
# ===========================================================================

packages:
  base: !include pv-display.yaml

substitutions:
  fw_version: "0.0.0-dev"

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG
