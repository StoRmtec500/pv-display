        - obj:
            styles: st_card
            align: TOP_MID
            y: 72
            width: 444
            height: 150
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Fronius Wechselrichter", text_color: 0x94A3B8 }
              - label: { id: lbl_ip, align: TOP_LEFT, y: 28, text: "nicht gesetzt", text_font: font_m, text_color: 0xF1F5F9 }
              - button:
                  align: TOP_RIGHT
                  width: 130
                  height: 44
                  styles: st_btn
                  bg_color: 0x2563EB
                  on_click:
                    - lambda: fronius_scan::start();
                  widgets:
                    - label: { align: CENTER, text: "Suchen", text_color: 0xFFFFFF }
              - bar:
                  id: bar_scan
                  align: BOTTOM_MID
                  y: -28
                  width: 100%
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x334155
                  indicator:
                    bg_color: 0x2563EB
              - label: { id: lbl_scan, align: BOTTOM_LEFT, text: "", text_color: 0x94A3B8 }

        # Helligkeit
        - obj:
            styles: st_card
            align: TOP_MID
            y: 234
            width: 444
            height: 90
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Helligkeit", text_color: 0x94A3B8 }
              - slider:
                  id: sld_brightness
                  align: BOTTOM_MID
                  y: -8
                  width: 390
                  min_value: 10
                  max_value: 100
                  value: 80
                  on_release:
                    - number.set:
                        id: brightness
                        value: !lambda return x;

        # Updates & Info
        - obj:
            styles: st_card
            align: TOP_MID
            y: 336
            width: 444
            height: 126
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Automatische Updates", text_color: 0x94A3B8 }
              - switch:
                  id: sw_auto_update
                  align: TOP_RIGHT
                  on_change:
                    - if:
                        condition:
                          lambda: return x;
                        then:
                          - switch.turn_on: auto_update
                        else:
                          - switch.turn_off: auto_update
              - label: { align: LEFT_MID, y: 2, text: "Version ${fw_version}", text_color: 0xF1F5F9 }
              - label: { id: lbl_web, align: BOTTOM_LEFT, text: "Web: --", text_color: 0x64748B }
              - button:
                  align: BOTTOM_RIGHT
                  width: 180
                  height: 40
                  styles: st_btn
                  on_click:
                    - if:
                        condition:
                          update.is_available: fw_update
                        then:
                          - lvgl.label.update: { id: lbl_update_btn, text: "Installiere …" }
                          - update.perform: fw_update
                        else:
                          - lvgl.label.update: { id: lbl_update_btn, text: "Prüfe …" }
                          - component.update: fw_update
                          - delay: 5s
                          - lvgl.label.update:
                              id: lbl_update_btn
                              text: !lambda |-
                                return id(fw_update).state == update::UPDATE_STATE_AVAILABLE
                                  ? std::string("Update ") + id(fw_update).update_info.latest_version
                                  : std::string("Aktuell");
                  widgets:
                    - label: { id: lbl_update_btn, align: CENTER, text: "Nach Updates suchen", text_color: 0xF1F5F9 }
