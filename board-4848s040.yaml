# ===========================================================================
#  PV-Display für Guition ESP32-4848S040 (ESP32-S3, 4", 480×480, kapazitiv)
#  Bauen:  esphome compile board-4848s040.yaml
# ===========================================================================

substitutions:
  name: pv-display
  friendly_name: PV Display
  project_name: mksoft.pv-display
  # Bestehende Geräte holen ihre Updates hier – Pfad nicht ändern
  update_manifest: https://update.mksoft.at/pv-display/manifest.json
  # Update-Popup: so viele Zeilen der Release-Beschreibung / Zeichen pro Zeile
  upd_lines: "6"
  upd_line_chars: "40"
  # Energiefluss-Seite: Mittelpunkt und Kanten der Knoten (Pixel)
  flow_cx: "240"
  flow_cy: "268"
  flow_top: "194"
  flow_bottom: "370"
  flow_left: "124"
  flow_right: "356"
  flow_dot_half: "6"
  # Hinweis im Chip unter dem Ring, wenn kein Wechselrichter antwortet
  offline_text: Wechselrichter offline
  # Akku-Kachel zeigt neben "lädt"/"entlädt" auch die Leistung
  akku_tile_power: "true"

packages:
  common: !include common.yaml

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_LWIP_MAX_SOCKETS: "16"    # Reserve für parallelen Netzwerk-Scan

psram:
  mode: octal
  speed: 80MHz

# Log über den USB-C-Anschluss (CH340/UART0). Der Standard USB-Serial-JTAG
# kollidiert mit GPIO19/20 (Touch-I2C bzw. Display-Daten) und zeigt dann nichts.
logger:
  hardware_uart: UART0

# ---------------------------------------------------------------------------
#  Hardware: Display, Touch, Hintergrundbeleuchtung
# ---------------------------------------------------------------------------

spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

display:
  - platform: mipi_rgb
    model: GUITION-4848S040
    id: main_display
    auto_clear_enabled: false
    update_interval: never

i2c:
  sda: GPIO19
  scl: GPIO45

touchscreen:
  - platform: gt911
    id: touch
    # Der Touch liefert um 180° gedrehte Koordinaten (Bild ist über mirror_x/y
    # des Displaymodells gedreht, der Touch-Chip nicht) -> hier mitdrehen.
    transform:
      mirror_x: true
      mirror_y: true

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_out
    frequency: 150Hz      # Wert aus der Board-Referenz

light:
  - platform: monochromatic
    id: backlight
    name: Display Beleuchtung
    output: backlight_out
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms


# ---------------------------------------------------------------------------
#  Schriften (mit Umlauten) und Symbole
# ---------------------------------------------------------------------------

font:
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: font_s
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: font_m
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: font_l
    size: 30
    bpp: 4
    glyphs: "0123456789.,-%: "
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: font_xl
    size: 64
    bpp: 4
    glyphs: "0123456789.,-"
  # Symbole: Material Design Icons
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon
    size: 44
    bpp: 4
    glyphs:
      - "\U000F0D9C"   # solar-panel-large
      - "\U000F0D3E"   # transmission-tower
      - "\U000F12A3"   # battery-high
      - "\U000F02DC"   # home
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon_m
    size: 26
    bpp: 4
    glyphs:
      - "\U000F1904"   # home-lightning-bolt-outline (Energiefluss)
      - "\U000F08BB"   # cog-outline (Einstellungen)
      - "\U000F0141"   # chevron-left (zurück)
      - "\U000F05A8"   # white-balance-sunny (Ersteinrichtung)
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon_s
    size: 18
    bpp: 4
    glyphs:
      - "\U000F05A8"   # white-balance-sunny
      - "\U000F02DC"   # home
      - "\U000F0D3E"   # transmission-tower
      - "\U000F12A3"   # battery-high
      - "\U000F00F6"   # calendar-today
      - "\U000F032A"   # leaf
      - "\U000F05D6"   # alert-circle-outline

# ---------------------------------------------------------------------------
#  Oberfläche (480 × 480)
#  Farben: Hintergrund 070B14 · Karte 111827 · Rand 1C2638 · Spur 1A2335
#          Text F8FAFC / 8391A7 · PV FACC15 · Netz-Einspeisung/Akku 4ADE80
#          Haus 60A5FA · Bezug F87171 · Aktion 2563EB
# ---------------------------------------------------------------------------

lvgl:
  displays: [main_display]
  touchscreens: [touch]
  buffer_size: 100%
  default_font: font_s

  style_definitions:
    - id: st_card
      bg_color: 0x111827
      bg_opa: COVER
      radius: 18
      border_width: 1
      border_color: 0x1C2638
      pad_all: 12
    - id: st_btn
      bg_color: 0x141C2E
      bg_opa: COVER
      radius: 14
      border_width: 1
      border_color: 0x1C2638
      shadow_width: 0
    - id: st_bare             # unsichtbarer Container (Layout-Hilfe)
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      radius: 0
    - id: st_chip
      bg_color: 0x111827
      bg_opa: COVER
      radius: 17
      border_width: 1
      border_color: 0x1C2638
      pad_left: 14
      pad_right: 14
      pad_top: 0
      pad_bottom: 0
    - id: st_node
      bg_color: 0x111827
      bg_opa: COVER
      radius: 46
      border_width: 4
      pad_all: 0

  # Update-Popup: liegt über allen Seiten, wird von script update_popup gesteuert
  top_layer:
    widgets:
      - obj:
          id: upd_popup
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 75%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - obj:
                align: CENTER
                width: 408
                height: 344
                styles: st_card
                radius: 22
                pad_all: 22
                scrollable: false
                widgets:
                  - label:
                      id: upd_title
                      align: TOP_MID
                      text: ""
                      text_font: font_m
                      text_color: 0xF8FAFC
                  - label:
                      id: upd_text
                      align: TOP_MID
                      y: 44
                      width: 360
                      long_mode: WRAP
                      text_align: CENTER
                      text: ""
                      text_color: 0xCBD5E1
                  - bar:
                      id: upd_bar
                      hidden: true
                      align: TOP_MID
                      y: 150
                      width: 340
                      height: 10
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x1A2335
                      indicator:
                        bg_color: 0x2563EB
                  - label:
                      id: upd_pct
                      hidden: true
                      align: BOTTOM_MID
                      text: ""
                      text_color: 0x8391A7
                  - obj:
                      id: upd_buttons
                      align: BOTTOM_MID
                      width: 100%
                      height: 50
                      styles: st_bare
                      scrollable: false
                      widgets:
                        - button:
                            align: LEFT_MID
                            width: 172
                            height: 50
                            styles: st_btn
                            on_click:
                              - lambda: id(upd_dismissed) = id(fw_update).update_info.latest_version;
                              - script.execute: update_popup
                            widgets:
                              - label: { align: CENTER, text: "Später", text_color: 0xF8FAFC }
                        - button:
                            align: RIGHT_MID
                            width: 172
                            height: 50
                            styles: st_btn
                            bg_color: 0x2563EB
                            border_width: 0
                            on_click:
                              - update.perform: fw_update
                            widgets:
                              - label: { align: CENTER, text: "Jetzt installieren", text_color: 0xFFFFFF }

  pages:
    # ======================= Hauptseite =======================
    - id: page_main
      bg_color: 0x070B14
      widgets:
        # ---- Kopfzeile: Uhrzeit + Datum, Status, Navigation ----
        - label:
            id: lbl_time
            x: 18
            y: 12
            text: "--:--"
            text_font: font_l
            text_color: 0xF8FAFC
        - label:
            id: lbl_date
            x: 19
            y: 48
            text: ""
            text_color: 0x8391A7
        - obj:
            styles: st_bare
            align: TOP_RIGHT
            x: -138
            y: 28
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            clickable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 7
            widgets:
              - obj:
                  id: dot_status
                  width: 10
                  height: 10
                  radius: 5
                  border_width: 0
                  bg_color: 0xEF4444
              - label:
                  id: lbl_status
                  text: "Verbinde …"
                  text_color: 0x8391A7
        - button:
            align: TOP_RIGHT
            x: -76
            y: 16
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_flow
            widgets:
              - label: { align: CENTER, text: "\U000F1904", text_font: font_icon_m, text_color: 0xFACC15 }
        - button:
            align: TOP_RIGHT
            x: -16
            y: 16
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_settings
            widgets:
              - label: { align: CENTER, text: "\U000F08BB", text_font: font_icon_m, text_color: 0xCBD5E1 }

        # ---- Ring: PV-Leistung im Verhältnis zur Anlagenleistung (kWp) ----
        # Alle Texte sind relativ zum Ring ausgerichtet und bleiben bei jedem Wert mittig.
        - obj:
            styles: st_bare
            align: TOP_MID
            y: 62
            width: 270
            height: 270
            clickable: false
            scrollable: false
            widgets:
              - arc:
                  id: arc_pv
                  align: CENTER
                  width: 270
                  height: 270
                  min_value: 0
                  max_value: 100
                  value: 0
                  adjustable: false
                  clickable: false
                  arc_color: 0x1A2335
                  arc_width: 22
                  arc_rounded: true
                  indicator:
                    arc_color: 0xFACC15
                    arc_width: 22
                    arc_rounded: true
                  knob:
                    bg_opa: TRANSP
                    pad_all: 0
              - obj:
                  styles: st_bare
                  align: CENTER
                  y: -66
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 6
                  widgets:
                    - label: { text: "\U000F05A8", text_font: font_icon_s, text_color: 0xFACC15 }
                    - label: { text: "Erzeugung", text_color: 0xFACC15 }
              - obj:
                  styles: st_bare
                  align: CENTER
                  y: -4
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: END
                    flex_align_track: CENTER
                    pad_column: 6
                  widgets:
                    - label:
                        id: lbl_pv
                        text: "--"
                        text_font: font_xl
                        text_color: 0xFDE047
                    - label:
                        id: lbl_pv_unit
                        text: "kW"
                        text_font: font_m
                        text_color: 0x8391A7
                        pad_bottom: 11
              - label:
                  id: lbl_pv_sub
                  align: CENTER
                  y: 52
                  text: ""
                  text_color: 0x8391A7

        # ---- Chips: Tagesertrag, Autarkie bzw. Verbindungshinweis ----
        - obj:
            styles: st_bare
            align: TOP_MID
            y: 298
            width: 100%
            height: 34
            clickable: false
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 10
            widgets:
              - obj:
                  styles: st_chip
                  width: SIZE_CONTENT
                  height: 34
                  clickable: false
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 6
                  widgets:
                    - label: { text: "\U000F00F6", text_font: font_icon_s, text_color: 0x8391A7 }
                    - label: { id: lbl_eday, text: "Heute --", text_color: 0xCBD5E1 }
              - obj:
                  id: chip_autarkie
                  hidden: true
                  styles: st_chip
                  width: SIZE_CONTENT
                  height: 34
                  border_color: 0x14532D
                  clickable: false
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 6
                  widgets:
                    - label: { id: ico_autarkie, text: "\U000F032A", text_font: font_icon_s, text_color: 0x4ADE80 }
                    - label: { id: lbl_autarkie, text: "", text_color: 0x4ADE80 }

        # ---- Kacheln: Haus / Netz / Akku ----
        - obj:
            styles: st_card
            x: 16
            y: 340
            width: 140
            height: 124
            pad_left: 10
            pad_right: 10
            scrollable: false
            widgets:
              - obj:
                  width: 30
                  height: 30
                  radius: 15
                  border_width: 0
                  pad_all: 0
                  bg_color: 0x450A0A
                  clickable: false
                  widgets:
                    - label: { align: CENTER, text: "\U000F02DC", text_font: font_icon_s, text_color: 0xF87171 }
              - label: { x: 38, y: 6, text: "Haus", text_color: 0x8391A7 }
              - obj:
                  styles: st_bare
                  y: 32
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: END, flex_align_track: CENTER, pad_column: 4 }
                  widgets:
                    - label: { id: lbl_load, text: "--", text_font: font_l, text_color: 0xF8FAFC }
                    - label: { id: lbl_load_unit, text: "kW", text_color: 0x8391A7, pad_bottom: 5 }
              - label: { align: BOTTOM_LEFT, text: "Verbrauch", text_color: 0xF87171 }
        - obj:
            styles: st_card
            x: 170
            y: 340
            width: 140
            height: 124
            pad_left: 10
            pad_right: 10
            scrollable: false
            widgets:
              - obj:
                  width: 30
                  height: 30
                  radius: 15
                  border_width: 0
                  pad_all: 0
                  bg_color: 0x1E293B
                  clickable: false
                  widgets:
                    - label: { align: CENTER, text: "\U000F0D3E", text_font: font_icon_s, text_color: 0xCBD5E1 }
              - label: { x: 38, y: 6, text: "Netz", text_color: 0x8391A7 }
              - obj:
                  styles: st_bare
                  y: 32
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: END, flex_align_track: CENTER, pad_column: 4 }
                  widgets:
                    - label: { id: lbl_grid, text: "--", text_font: font_l, text_color: 0xF8FAFC }
                    - label: { id: lbl_grid_unit, text: "kW", text_color: 0x8391A7, pad_bottom: 5 }
              - label: { id: lbl_grid_sub, align: BOTTOM_LEFT, text: "", text_color: 0x8391A7 }
        - obj:
            styles: st_card
            x: 324
            y: 340
            width: 140
            height: 124
            pad_left: 10
            pad_right: 10
            scrollable: false
            widgets:
              - obj:
                  width: 30
                  height: 30
                  radius: 15
                  border_width: 0
                  pad_all: 0
                  bg_color: 0x14532D
                  clickable: false
                  widgets:
                    - label: { align: CENTER, text: "\U000F12A3", text_font: font_icon_s, text_color: 0x4ADE80 }
              - label: { x: 38, y: 6, text: "Akku", text_color: 0x8391A7 }
              - obj:
                  styles: st_bare
                  y: 32
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  clickable: false
                  layout: { type: flex, flex_flow: ROW, flex_align_cross: END, flex_align_track: CENTER, pad_column: 4 }
                  widgets:
                    - label: { id: lbl_soc, text: "--", text_font: font_l, text_color: 0xF8FAFC }
                    - label: { text: "%", text_color: 0x8391A7, pad_bottom: 5 }
              - bar:
                  id: bar_soc
                  align: BOTTOM_LEFT
                  y: -22
                  width: 100%
                  height: 6
                  min_value: 0
                  max_value: 100
                  value: 0
                  radius: 3
                  bg_color: 0x1A2335
                  indicator:
                    bg_color: 0x4ADE80
                    radius: 3
              - label: { id: lbl_akku_sub, align: BOTTOM_LEFT, text: "kein Akku", text_color: 0x8391A7 }

        # Hinweis bei fehlendem WLAN (überdeckt die Kacheln)
        - obj:
            id: hint_box
            styles: st_card
            bg_color: 0x172554
            border_color: 0x1E3A8A
            x: 16
            y: 340
            width: 448
            height: 124
            scrollable: false
            widgets:
              - label:
                  width: 100%
                  long_mode: WRAP
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xF8FAFC
                  text: "WLAN einrichten: Mit dem Handy das WLAN „${setup_ssid}“ verbinden (Passwort: ${setup_password}) und den Anweisungen folgen."

    # ======================= Ersteinrichtung =======================
    # Wird beim Start gezeigt, solange kein Wechselrichter gespeichert ist.
    # Inhalt setzt das Script setup_render in common.yaml.
    - id: page_setup
      bg_color: 0x070B14
      widgets:
        - label:
            align: TOP_MID
            y: 34
            text: "Willkommen"
            text_font: font_m
            text_color: 0xF8FAFC
        - label:
            id: setup_step
            align: TOP_MID
            y: 68
            text: ""
            text_color: 0x8391A7
        - obj:
            styles: st_node
            align: TOP_MID
            y: 100
            width: 64
            height: 64
            radius: 32
            border_width: 3
            border_color: 0xFACC15
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F05A8", text_font: font_icon_m, text_color: 0xFACC15 }
        - label:
            id: setup_text
            align: TOP_MID
            y: 178
            width: 420
            long_mode: WRAP
            text_align: CENTER
            text: ""
            text_color: 0xF8FAFC
        - label:
            id: setup_ip_caption
            align: TOP_MID
            y: 262
            text: ""
            text_color: 0x8391A7
        - label:
            id: setup_ip
            align: TOP_MID
            y: 286
            text: ""
            text_font: font_m
            text_color: 0x60A5FA
        - bar:
            id: setup_bar
            align: TOP_MID
            y: 336
            width: 380
            height: 10
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x1A2335
            indicator:
              bg_color: 0x2563EB
        - label:
            id: setup_status
            align: TOP_MID
            y: 358
            width: 420
            long_mode: DOT
            text_align: CENTER
            text: ""
            text_color: 0x8391A7
        - button:
            id: btn_setup_retry
            hidden: true
            align: BOTTOM_MID
            x: -100
            y: -24
            width: 190
            height: 50
            styles: st_btn
            bg_color: 0x2563EB
            border_width: 0
            on_click:
              - lambda: |-
                  id(scan_repair) = false;
                  fronius_scan::start();
              - script.execute: setup_render
            widgets:
              - label: { align: CENTER, text: "Erneut suchen", text_color: 0xFFFFFF }
        - button:
            align: BOTTOM_MID
            x: 100
            y: -24
            width: 190
            height: 50
            styles: st_btn
            on_click:
              - lambda: id(setup_mode) = false;
              - lvgl.page.show: page_main
              - script.execute: update_popup
            widgets:
              - label: { align: CENTER, text: "Überspringen", text_color: 0xF8FAFC }

    # ======================= Energiefluss =======================
    # Knoten (Ø 92): PV oben, Netz links, Akku rechts, Haus unten; Mitte bei (240/268).
    # Leitungen und Rahmen färbt das 40-ms-Intervall in common.yaml, sobald Strom fließt.
    - id: page_flow
      bg_color: 0x070B14
      on_load:
        - lambda: id(flow_active) = true;
      on_unload:
        - lambda: id(flow_active) = false;
      widgets:
        - button:
            x: 16
            y: 16
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_main
            widgets:
              - label: { align: CENTER, text: "\U000F0141", text_font: font_icon_m, text_color: 0xCBD5E1 }
        - label:
            align: TOP_MID
            y: 27
            text: "Energiefluss"
            text_font: font_m
            text_color: 0xF8FAFC

        # Leitungen (Knoten -> Mitte)
        - line: { id: ln_pv,   points: ["240, 194", "240, 268"], line_width: 6, line_color: 0x1E293B, line_rounded: true }
        - line: { id: ln_grid, points: ["124, 268", "240, 268"], line_width: 6, line_color: 0x1E293B, line_rounded: true }
        - line: { id: ln_akku, points: ["356, 268", "240, 268"], line_width: 6, line_color: 0x1E293B, line_rounded: true }
        - line: { id: ln_haus, points: ["240, 268", "240, 370"], line_width: 6, line_color: 0x1E293B, line_rounded: true }
        - obj: { x: 231, y: 259, width: 18, height: 18, radius: 9, bg_color: 0x070B14, border_width: 3, border_color: 0x475569, clickable: false }

        # Knoten
        - obj:
            id: node_pv
            styles: st_node
            x: 194
            y: 102
            width: 92
            height: 92
            border_color: 0xFACC15
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0D9C", text_font: font_icon, text_color: 0xFACC15 }
        - obj:
            id: node_grid
            styles: st_node
            x: 32
            y: 222
            width: 92
            height: 92
            border_color: 0x475569
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0D3E", text_font: font_icon, text_color: 0xCBD5E1 }
        - obj:
            id: node_akku
            styles: st_node
            x: 356
            y: 222
            width: 92
            height: 92
            border_color: 0x334155
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F12A3", text_font: font_icon, text_color: 0x4ADE80 }
        - obj:
            styles: st_node
            x: 194
            y: 370
            width: 92
            height: 92
            border_color: 0xF87171
            clickable: false
            widgets:
              - label: { align: CENTER, text: "\U000F02DC", text_font: font_icon, text_color: 0xF87171 }

        # Werte an den Knoten
        - label: { x: 302, y: 120, text: "Erzeugung", text_color: 0x8391A7 }
        - label: { id: lbl_f_pv, x: 302, y: 142, text: "--", text_font: font_m, text_color: 0xFDE047 }
        - label: { id: lbl_f_grid, x: 3, y: 322, width: 150, text_align: CENTER, text: "--", text_font: font_m, text_color: 0xF8FAFC }
        - label: { id: lbl_f_grid_sub, x: 3, y: 350, width: 150, text_align: CENTER, text: "", text_color: 0x8391A7 }
        - label: { id: lbl_f_soc, x: 327, y: 322, width: 150, text_align: CENTER, text: "--", text_font: font_m, text_color: 0xF8FAFC }
        - label: { id: lbl_f_akku, x: 318, y: 350, width: 160, text_align: CENTER, text: "", text_color: 0x8391A7 }
        - label: { x: 302, y: 388, text: "Haus", text_color: 0x8391A7 }
        - label: { id: lbl_f_load, x: 302, y: 410, text: "--", text_font: font_m, text_color: 0xF87171 }

        # Bewegte Punkte (Position setzt das 40-ms-Intervall)
        - obj: { id: dot_pv,   hidden: true, width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0xFDE047, clickable: false }
        - obj: { id: dot_grid, hidden: true, width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0xF8FAFC, clickable: false }
        - obj: { id: dot_akku, hidden: true, width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0x4ADE80, clickable: false }
        - obj: { id: dot_haus, hidden: true, width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0xF87171, clickable: false }

    # ======================= Einstellungen =======================
    - id: page_settings
      bg_color: 0x070B14
      widgets:
        - button:
            x: 16
            y: 16
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_main
            widgets:
              - label: { align: CENTER, text: "\U000F0141", text_font: font_icon_m, text_color: 0xCBD5E1 }
        - label:
            align: TOP_MID
            y: 27
            text: "Einstellungen"
            text_font: font_m
            text_color: 0xF8FAFC

        # Wechselrichter
        - obj:
            styles: st_card
            align: TOP_MID
            y: 80
            width: 448
            height: 146
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Fronius Wechselrichter (max. 3)", text_color: 0x8391A7 }
              - label: { id: lbl_ip, align: TOP_LEFT, y: 28, width: 280, long_mode: DOT, text: "nicht gesetzt", text_font: font_m, text_color: 0xF8FAFC }
              - button:
                  align: TOP_RIGHT
                  width: 124
                  height: 46
                  styles: st_btn
                  bg_color: 0x2563EB
                  border_width: 0
                  on_click:
                    - lambda: fronius_scan::start();
                  widgets:
                    - label: { align: CENTER, text: "Suchen", text_color: 0xFFFFFF }
              - bar:
                  id: bar_scan
                  align: BOTTOM_MID
                  y: -28
                  width: 100%
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x1A2335
                  indicator:
                    bg_color: 0x2563EB
              - label: { id: lbl_scan, align: BOTTOM_LEFT, text: "", text_color: 0x8391A7 }

        # Helligkeit
        - obj:
            styles: st_card
            align: TOP_MID
            y: 238
            width: 448
            height: 92
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Helligkeit", text_color: 0x8391A7 }
              - slider:
                  id: sld_brightness
                  align: BOTTOM_MID
                  y: -8
                  width: 392
                  min_value: 10
                  max_value: 100
                  value: 80
                  bg_color: 0x1A2335
                  indicator:
                    bg_color: 0x2563EB
                  knob:
                    bg_color: 0xF8FAFC
                  on_release:
                    - number.set:
                        id: brightness
                        value: !lambda return x;

        # Updates & Info
        - obj:
            styles: st_card
            align: TOP_MID
            y: 342
            width: 448
            height: 122
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Automatische Updates", text_color: 0x8391A7 }
              - switch:
                  id: sw_auto_update
                  align: TOP_RIGHT
                  bg_color: 0x334155
                  indicator:
                    checked:
                      bg_color: 0x2563EB
                  on_change:
                    - if:
                        condition:
                          lambda: return x;
                        then:
                          - switch.turn_on: auto_update
                        else:
                          - switch.turn_off: auto_update
              - label: { id: lbl_fw_version, align: LEFT_MID, y: 2, text: "Version ${fw_version}", text_color: 0xF8FAFC }
              - label: { id: lbl_web, align: BOTTOM_LEFT, text: "Web: --", text_color: 0x64748B }
              - button:
                  align: BOTTOM_RIGHT
                  width: 184
                  height: 42
                  styles: st_btn
                  on_click:
                    - if:
                        condition:
                          update.is_available: fw_update
                        then:
                          # Details im Popup zeigen, dort wird installiert
                          - lambda: id(upd_dismissed) = "";
                          - script.execute: update_popup
                        else:
                          - lvgl.label.update: { id: lbl_update_btn, text: "Prüfe …" }
                          - component.update: fw_update
                          - delay: 5s
                          - lvgl.label.update:
                              id: lbl_update_btn
                              text: !lambda |-
                                return id(fw_update).state == update::UPDATE_STATE_AVAILABLE
                                  ? std::string("Update ") + id(fw_update).update_info.latest_version
                                  : std::string("Aktuell");
                  widgets:
                    - label: { id: lbl_update_btn, align: CENTER, text: "Nach Updates suchen", text_color: 0xF8FAFC }
