# ===========================================================================
#  PV-Display für Guition ESP32-4848S040 (ESP32-S3, 4", 480×480, kapazitiv)
#  Bauen:  esphome compile board-4848s040.yaml
# ===========================================================================

substitutions:
  name: pv-display
  friendly_name: PV Display
  project_name: mksoft.pv-display
  # Bestehende Geräte holen ihre Updates hier – Pfad nicht ändern
  update_manifest: https://update.mksoft.at/pv-display/manifest.json
  # Update-Popup: so viele Zeilen der Release-Beschreibung / Zeichen pro Zeile
  upd_lines: "6"
  upd_line_chars: "40"
  # Energiefluss-Seite: Mittelpunkt und Kanten der Knoten (Pixel)
  flow_cx: "240"
  flow_cy: "250"
  flow_top: "150"
  flow_bottom: "350"
  flow_left: "130"
  flow_right: "350"
  flow_dot_half: "7"

packages:
  common: !include common.yaml

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_LWIP_MAX_SOCKETS: "16"    # Reserve für parallelen Netzwerk-Scan

psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
#  Hardware: Display, Touch, Hintergrundbeleuchtung
# ---------------------------------------------------------------------------

spi:
  clk_pin: GPIO48
  mosi_pin: GPIO47

display:
  - platform: mipi_rgb
    model: GUITION-4848S040
    id: main_display
    auto_clear_enabled: false
    update_interval: never

i2c:
  sda: GPIO19
  scl: GPIO45

touchscreen:
  - platform: gt911
    id: touch

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_out

light:
  - platform: monochromatic
    id: backlight
    name: Display Beleuchtung
    output: backlight_out
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# ---------------------------------------------------------------------------
#  Schriften (mit Umlauten)
# ---------------------------------------------------------------------------

font:
  - file: { type: gfonts, family: Inter, weight: 500 }
    id: font_s
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Inter, weight: 600 }
    id: font_m
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: font_l
    size: 30
    bpp: 4
    glyphs: "0123456789.,-% "
  - file: { type: gfonts, family: Inter, weight: 700 }
    id: font_xl
    size: 64
    bpp: 4
    glyphs: "0123456789.,-"
  # Icons: Material Design Icons
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon
    size: 40
    bpp: 4
    glyphs:
      - "\U000F0A72"   # solar-power
      - "\U000F0D3E"   # transmission-tower
      - "\U000F0079"   # battery
      - "\U000F02DC"   # home
  - file:
      type: web
      url: https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf
    id: font_icon_s
    size: 26
    bpp: 4
    glyphs:
      - "\U000F0A72"   # solar-power

# ---------------------------------------------------------------------------
#  Oberfläche (480 × 480)
# ---------------------------------------------------------------------------

lvgl:
  displays: [main_display]
  touchscreens: [touch]
  buffer_size: 100%
  default_font: font_s

  style_definitions:
    - id: st_card
      bg_color: 0x1E293B
      bg_opa: COVER
      radius: 18
      border_width: 0
      pad_all: 12
    - id: st_btn
      bg_color: 0x334155
      radius: 12
      border_width: 0
      shadow_width: 0

  # Update-Popup: liegt über allen Seiten, wird von script update_popup gesteuert
  top_layer:
    widgets:
      - obj:
          id: upd_popup
          hidden: true
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 70%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollable: false
          widgets:
            - obj:
                align: CENTER
                width: 400
                height: 340
                bg_color: 0x1E293B
                bg_opa: COVER
                border_width: 1
                border_color: 0x334155
                radius: 16
                pad_all: 20
                scrollable: false
                widgets:
                  - label:
                      id: upd_title
                      align: TOP_MID
                      text: ""
                      text_font: font_m
                      text_color: 0xF1F5F9
                  - label:
                      id: upd_text
                      align: TOP_MID
                      y: 44
                      width: 360
                      long_mode: WRAP
                      text_align: CENTER
                      text: ""
                      text_color: 0xCBD5E1
                  - bar:
                      id: upd_bar
                      hidden: true
                      align: TOP_MID
                      y: 150
                      width: 340
                      height: 12
                      min_value: 0
                      max_value: 100
                      value: 0
                      bg_color: 0x334155
                      indicator:
                        bg_color: 0x2563EB
                  - label:
                      id: upd_pct
                      hidden: true
                      align: BOTTOM_MID
                      text: ""
                      text_color: 0x94A3B8
                  - obj:
                      id: upd_buttons
                      align: BOTTOM_MID
                      width: 100%
                      height: 48
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      widgets:
                        - button:
                            align: LEFT_MID
                            width: 170
                            height: 48
                            styles: st_btn
                            on_click:
                              - lambda: id(upd_dismissed) = id(fw_update).update_info.latest_version;
                              - script.execute: update_popup
                            widgets:
                              - label: { align: CENTER, text: "Später", text_color: 0xF1F5F9 }
                        - button:
                            align: RIGHT_MID
                            width: 170
                            height: 48
                            styles: st_btn
                            bg_color: 0x2563EB
                            on_click:
                              - update.perform: fw_update
                            widgets:
                              - label: { align: CENTER, text: "Jetzt installieren", text_color: 0xFFFFFF }

  pages:
    # ======================= Hauptseite =======================
    - id: page_main
      bg_color: 0x0B1120
      widgets:
        - label:
            id: lbl_time
            align: TOP_LEFT
            x: 20
            y: 18
            text: "--:--"
            text_font: font_m
            text_color: 0xE2E8F0
        - label:
            id: lbl_eday
            align: TOP_MID
            y: 22
            text: ""
            text_color: 0x94A3B8
        - button:
            align: TOP_RIGHT
            x: -68
            y: 8
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_flow
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0A72"
                  text_font: font_icon_s
                  text_color: 0xFACC15
        - obj:
            id: dot_status
            align: TOP_RIGHT
            x: -128
            y: 26
            width: 12
            height: 12
            radius: 6
            border_width: 0
            bg_color: 0xEF4444
        - button:
            align: TOP_RIGHT
            x: -12
            y: 8
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_settings
            widgets:
              - label:
                  align: CENTER
                  text: "\uF013"
                  text_font: montserrat_24
                  text_color: 0xE2E8F0

        # Ring = aktuelle PV-Leistung im Verhältnis zur Anlagenleistung (kWp)
        - arc:
            id: arc_pv
            align: TOP_MID
            y: 66
            width: 250
            height: 250
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_color: 0x1E293B
            arc_width: 16
            indicator:
              arc_color: 0xFACC15
              arc_width: 16
            knob:
              bg_opa: TRANSP
        - label:
            align_to: { id: arc_pv, align: CENTER, y: -52 }
            text: "PV-Leistung"
            text_color: 0x94A3B8
        - label:
            id: lbl_pv
            align_to: { id: arc_pv, align: CENTER, y: -4 }
            text: "--"
            text_font: font_xl
            text_color: 0xFACC15
        - label:
            id: lbl_pv_unit
            align_to: { id: arc_pv, align: CENTER, y: 40 }
            text: "kW"
            text_font: font_m
            text_color: 0x94A3B8
        - label:
            id: lbl_autarkie
            align_to: { id: arc_pv, align: CENTER, y: 76 }
            text: ""
            text_color: 0x4ADE80

        # Kacheln: Haus / Netz / Akku
        - obj:
            styles: st_card
            align: BOTTOM_LEFT
            x: 18
            y: -18
            width: 140
            height: 118
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Haus", text_color: 0x94A3B8 }
              - label: { id: lbl_load_unit, align: TOP_RIGHT, text: "kW", text_color: 0x64748B }
              - label: { id: lbl_load, align: LEFT_MID, y: 6, text: "--", text_font: font_l, text_color: 0xF1F5F9 }
              - label: { align: BOTTOM_LEFT, text: "Verbrauch", text_color: 0x64748B }
        - obj:
            styles: st_card
            align: BOTTOM_MID
            y: -18
            width: 140
            height: 118
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Netz", text_color: 0x94A3B8 }
              - label: { id: lbl_grid_unit, align: TOP_RIGHT, text: "kW", text_color: 0x64748B }
              - label: { id: lbl_grid, align: LEFT_MID, y: 6, text: "--", text_font: font_l, text_color: 0xF1F5F9 }
              - label: { id: lbl_grid_sub, align: BOTTOM_LEFT, text: "", text_color: 0x64748B }
        - obj:
            styles: st_card
            align: BOTTOM_RIGHT
            x: -18
            y: -18
            width: 140
            height: 118
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Akku", text_color: 0x94A3B8 }
              - label: { id: lbl_soc, align: LEFT_MID, y: 6, text: "--", text_font: font_l, text_color: 0xF1F5F9 }
              - label: { id: lbl_akku_sub, align: BOTTOM_LEFT, text: "kein Akku", text_color: 0x64748B }

        # Hinweis bei fehlendem WLAN (überdeckt die Kacheln)
        - obj:
            id: hint_box
            styles: st_card
            bg_color: 0x1E3A8A
            align: BOTTOM_MID
            y: -18
            width: 444
            height: 118
            scrollable: false
            widgets:
              - label:
                  width: 100%
                  long_mode: WRAP
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xF1F5F9
                  text: "WLAN einrichten: Mit dem Handy das WLAN „${setup_ssid}“ verbinden (Passwort: ${setup_password}) und den Anweisungen folgen."

    # ======================= Ersteinrichtung =======================
    # Wird beim Start gezeigt, solange kein Wechselrichter gespeichert ist.
    # Inhalt setzt das Script setup_render in common.yaml.
    - id: page_setup
      bg_color: 0x0B1120
      widgets:
        - label:
            align: TOP_MID
            y: 34
            text: "Willkommen"
            text_font: font_m
            text_color: 0xF1F5F9
        - label:
            id: setup_step
            align: TOP_MID
            y: 68
            text: ""
            text_color: 0x94A3B8
        - label:
            align: TOP_MID
            y: 104
            text: "\U000F0A72"
            text_font: font_icon
            text_color: 0xFACC15
        - label:
            id: setup_text
            align: TOP_MID
            y: 162
            width: 420
            long_mode: WRAP
            text_align: CENTER
            text: ""
            text_color: 0xF1F5F9
        - label:
            id: setup_ip_caption
            align: TOP_MID
            y: 252
            text: ""
            text_color: 0x94A3B8
        - label:
            id: setup_ip
            align: TOP_MID
            y: 276
            text: ""
            text_font: font_m
            text_color: 0x60A5FA
        - bar:
            id: setup_bar
            align: TOP_MID
            y: 330
            width: 380
            height: 10
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x334155
            indicator:
              bg_color: 0x2563EB
        - label:
            id: setup_status
            align: TOP_MID
            y: 352
            width: 420
            long_mode: DOT
            text_align: CENTER
            text: ""
            text_color: 0x94A3B8
        - button:
            id: btn_setup_retry
            hidden: true
            align: BOTTOM_MID
            x: -100
            y: -28
            width: 190
            height: 48
            styles: st_btn
            bg_color: 0x2563EB
            on_click:
              - lambda: |-
                  id(scan_repair) = false;
                  fronius_scan::start();
              - script.execute: setup_render
            widgets:
              - label: { align: CENTER, text: "Erneut suchen", text_color: 0xFFFFFF }
        - button:
            align: BOTTOM_MID
            x: 100
            y: -28
            width: 190
            height: 48
            styles: st_btn
            on_click:
              - lambda: id(setup_mode) = false;
              - lvgl.page.show: page_main
              - script.execute: update_popup
            widgets:
              - label: { align: CENTER, text: "Überspringen", text_color: 0xF1F5F9 }

    # ======================= Energiefluss =======================
    # Knoten: PV oben, Netz links, Akku rechts, Haus unten; Mitte bei (240/250)
    - id: page_flow
      bg_color: 0x0B1120
      on_load:
        - lambda: id(flow_active) = true;
      on_unload:
        - lambda: id(flow_active) = false;
      widgets:
        - button:
            align: TOP_LEFT
            x: 12
            y: 8
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_main
            widgets:
              - label:
                  align: CENTER
                  text: ""
                  text_font: montserrat_24
                  text_color: 0xE2E8F0
        - label:
            align: TOP_MID
            y: 20
            text: "Energiefluss"
            text_font: font_m
            text_color: 0xF1F5F9

        # Leitungen (Knoten -> Mitte)
        - line: { points: ["240, 150", "240, 250"], line_width: 4, line_color: 0x334155, line_rounded: true }
        - line: { points: ["130, 250", "240, 250"], line_width: 4, line_color: 0x334155, line_rounded: true }
        - line: { points: ["350, 250", "240, 250"], line_width: 4, line_color: 0x334155, line_rounded: true }
        - line: { points: ["240, 250", "240, 350"], line_width: 4, line_color: 0x334155, line_rounded: true }
        - obj: { x: 233, y: 243, width: 14, height: 14, radius: 7, border_width: 0, bg_color: 0x475569 }

        # Knoten
        - obj:
            x: 198
            y: 66
            width: 84
            height: 84
            radius: 42
            bg_color: 0x1E293B
            border_width: 3
            border_color: 0xFACC15
            scrollable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0A72", text_font: font_icon, text_color: 0xFACC15 }
        - obj:
            x: 46
            y: 208
            width: 84
            height: 84
            radius: 42
            bg_color: 0x1E293B
            border_width: 3
            border_color: 0x94A3B8
            scrollable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0D3E", text_font: font_icon, text_color: 0x94A3B8 }
        - obj:
            x: 350
            y: 208
            width: 84
            height: 84
            radius: 42
            bg_color: 0x1E293B
            border_width: 3
            border_color: 0x4ADE80
            scrollable: false
            widgets:
              - label: { align: CENTER, text: "\U000F0079", text_font: font_icon, text_color: 0x4ADE80 }
        - obj:
            x: 198
            y: 350
            width: 84
            height: 84
            radius: 42
            bg_color: 0x1E293B
            border_width: 3
            border_color: 0x60A5FA
            scrollable: false
            widgets:
              - label: { align: CENTER, text: "\U000F02DC", text_font: font_icon, text_color: 0x60A5FA }

        # Werte neben den Knoten
        - label: { x: 296, y: 80, text: "PV", text_color: 0x94A3B8 }
        - label: { id: lbl_f_pv, x: 296, y: 102, text: "--", text_font: font_m, text_color: 0xFACC15 }
        - label: { id: lbl_f_grid, x: 28, y: 300, width: 120, text_align: CENTER, text: "--", text_font: font_m }
        - label: { id: lbl_f_grid_sub, x: 28, y: 328, width: 120, text_align: CENTER, text: "", text_color: 0x94A3B8 }
        - label: { id: lbl_f_soc, x: 332, y: 300, width: 120, text_align: CENTER, text: "--", text_font: font_m, text_color: 0x4ADE80 }
        - label: { id: lbl_f_akku, x: 322, y: 328, width: 140, text_align: CENTER, text: "", text_color: 0x94A3B8 }
        - label: { x: 296, y: 364, text: "Haus", text_color: 0x94A3B8 }
        - label: { id: lbl_f_load, x: 296, y: 386, text: "--", text_font: font_m, text_color: 0x60A5FA }

        # Bewegte Punkte (Position setzt das 40-ms-Intervall)
        - obj: { id: dot_pv,   hidden: true, width: 14, height: 14, radius: 7, border_width: 0, bg_color: 0xFACC15 }
        - obj: { id: dot_grid, hidden: true, width: 14, height: 14, radius: 7, border_width: 0, bg_color: 0xF1F5F9 }
        - obj: { id: dot_akku, hidden: true, width: 14, height: 14, radius: 7, border_width: 0, bg_color: 0x4ADE80 }
        - obj: { id: dot_haus, hidden: true, width: 14, height: 14, radius: 7, border_width: 0, bg_color: 0x60A5FA }

    # ======================= Einstellungen =======================
    - id: page_settings
      bg_color: 0x0B1120
      widgets:
        - button:
            align: TOP_LEFT
            x: 12
            y: 8
            width: 48
            height: 48
            styles: st_btn
            on_click:
              - lvgl.page.show: page_main
            widgets:
              - label:
                  align: CENTER
                  text: "\uF053"
                  text_font: montserrat_24
                  text_color: 0xE2E8F0
        - label:
            align: TOP_MID
            y: 20
            text: "Einstellungen"
            text_font: font_m
            text_color: 0xF1F5F9

        # Wechselrichter
        - obj:
            styles: st_card
            align: TOP_MID
            y: 72
            width: 444
            height: 150
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Fronius Wechselrichter (max. 3)", text_color: 0x94A3B8 }
              - label: { id: lbl_ip, align: TOP_LEFT, y: 28, width: 280, long_mode: DOT, text: "nicht gesetzt", text_font: font_m, text_color: 0xF1F5F9 }
              - button:
                  align: TOP_RIGHT
                  width: 130
                  height: 44
                  styles: st_btn
                  bg_color: 0x2563EB
                  on_click:
                    - lambda: fronius_scan::start();
                  widgets:
                    - label: { align: CENTER, text: "Suchen", text_color: 0xFFFFFF }
              - bar:
                  id: bar_scan
                  align: BOTTOM_MID
                  y: -28
                  width: 100%
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x334155
                  indicator:
                    bg_color: 0x2563EB
              - label: { id: lbl_scan, align: BOTTOM_LEFT, text: "", text_color: 0x94A3B8 }

        # Helligkeit
        - obj:
            styles: st_card
            align: TOP_MID
            y: 234
            width: 444
            height: 90
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Helligkeit", text_color: 0x94A3B8 }
              - slider:
                  id: sld_brightness
                  align: BOTTOM_MID
                  y: -8
                  width: 390
                  min_value: 10
                  max_value: 100
                  value: 80
                  on_release:
                    - number.set:
                        id: brightness
                        value: !lambda return x;

        # Updates & Info
        - obj:
            styles: st_card
            align: TOP_MID
            y: 336
            width: 444
            height: 126
            scrollable: false
            widgets:
              - label: { align: TOP_LEFT, text: "Automatische Updates", text_color: 0x94A3B8 }
              - switch:
                  id: sw_auto_update
                  align: TOP_RIGHT
                  on_change:
                    - if:
                        condition:
                          lambda: return x;
                        then:
                          - switch.turn_on: auto_update
                        else:
                          - switch.turn_off: auto_update
              - label: { id: lbl_fw_version, align: LEFT_MID, y: 2, text: "Version ${fw_version}", text_color: 0xF1F5F9 }
              - label: { id: lbl_web, align: BOTTOM_LEFT, text: "Web: --", text_color: 0x64748B }
              - button:
                  align: BOTTOM_RIGHT
                  width: 180
                  height: 40
                  styles: st_btn
                  on_click:
                    - if:
                        condition:
                          update.is_available: fw_update
                        then:
                          # Details im Popup zeigen, dort wird installiert
                          - lambda: id(upd_dismissed) = "";
                          - script.execute: update_popup
                        else:
                          - lvgl.label.update: { id: lbl_update_btn, text: "Prüfe …" }
                          - component.update: fw_update
                          - delay: 5s
                          - lvgl.label.update:
                              id: lbl_update_btn
                              text: !lambda |-
                                return id(fw_update).state == update::UPDATE_STATE_AVAILABLE
                                  ? std::string("Update ") + id(fw_update).update_info.latest_version
                                  : std::string("Aktuell");
                  widgets:
                    - label: { id: lbl_update_btn, align: CENTER, text: "Nach Updates suchen", text_color: 0xF1F5F9 }
